const empty=()=>({clients:[],engagements:[],properties:[],assessments:[],activeEngagementId:null});
let state=empty();const ui={step:'capture',modal:null,drawerId:null,decision:null,editPropertyId:null,newEngagement:false};
const active=()=>state.engagements.find(e=>e.id===state.activeEngagementId),client=()=>state.clients.find(c=>c.id===active()?.clientId),property=pid=>state.properties.find(p=>p.id===pid),records=()=>state.assessments.filter(r=>r.engagementId===state.activeEngagementId),record=pid=>records().find(r=>r.propertyId===pid);
const blankBrief=()=>({budget:null,beds:null,areas:[],stepFree:null,notes:''});
function fit(pid){const p=property(pid),b=active().brief;return [{key:'price',name:'Price',want:b.budget===null?'Budget not set':'Up to '+money(b.budget),found:p.price===null?'Not entered':money(p.price),status:b.budget===null?'Brief incomplete':p.price===null?'Unknown':p.price<=b.budget?'Match':'Mismatch'},{key:'beds',name:'Bedrooms',want:b.beds===null?'Minimum not set':b.beds+' or more',found:p.beds===null?'Not entered':String(p.beds),status:b.beds===null?'Brief incomplete':p.beds===null?'Unknown':p.beds>=b.beds?'Match':'Mismatch'},{key:'area',name:'Location',want:b.areas.length?b.areas.join(' / '):'Areas not set',found:p.suburb||'Not entered',status:!b.areas.length?'Brief incomplete':!p.suburb?'Unknown':b.areas.some(a=>a.toLowerCase()===p.suburb.toLowerCase())?'Match':'Mismatch'},...(b.stepFree===true?[{key:'access',name:'Step-free access',want:'Required',found:p.stepFree===null?'Not known':p.stepFree?'Yes':'No',status:p.stepFree===null?'Unknown':p.stepFree?'Match':'Mismatch'}]:[])];}
const unresolved=pid=>fit(pid).some(f=>f.status!=='Match');
function badge(value){return `<span class="pill ${value==='Mismatch'?'bad':value==='Unknown'||value==='Brief incomplete'?'warn':''}">${esc(value)}</span>`;}
function fitBadge(pid){const results=fit(pid),issue=results.find(f=>f.status==='Mismatch')||results.find(f=>f.status!=='Match');return badge(issue?issue.status:'Matches entered brief');}
function briefChips(){const b=active().brief;return `<div class="brief-summary">${b.budget===null?'<span class="chip">Budget not set</span>':'<span class="chip">Up to '+money(b.budget)+'</span>'}${b.beds===null?'':'<span class="chip">'+b.beds+'+ bedrooms</span>'}${b.areas.length?'<span class="chip">'+esc(b.areas.join(' / '))+'</span>':''}${b.stepFree===true?'<span class="chip">Step-free access required</span>':''}</div>`;}
function field(name,label,type='text',value='',extra=''){return `<div><label for="${name}">${label}</label><input id="${name}" type="${type}" value="${esc(value??'')}" ${extra}></div>`;}
function accessSelect(name,value){return `<select id="${name}"><option value="">Not specified / unknown</option><option value="yes" ${value===true?'selected':''}>Yes</option><option value="no" ${value===false?'selected':''}>No</option></select>`;}
function steps(){return `<nav class="process-row" aria-label="Engagement journey">${[['capture','1','Conversation'],['brief','2','Buyer brief'],['properties','3','Properties'],['shortlist','4','Shortlist']].map(([key,num,label],i)=>`${i?'<span class="muted">›</span>':''}<button data-step="${key}" class="${ui.step===key?'active':''}"><span class="step-circle">${num}</span>${label}</button>`).join('')}</nav>`;}
function workspaceTools(){return `<div class="workspace-note"><span>Working prototype · this tab only. Export to keep your records.</span><div class="toolbar">${active()?'<button data-step="history">Client history</button><button data-action="new-engagement">New engagement +</button>':''}<button data-action="export" ${state.clients.length?'':'disabled'}>Export workspace</button><button data-action="import">Open workspace file</button><button class="quiet" data-action="about">About</button></div></div>`;}
function emptyScreen(){return `<section class="empty-start"><div class="eyebrow">Your next buying engagement</div><h1>A clear path from<br>conversation to shortlist.</h1><p class="muted">Start with your own client. Bring in a consultation, record the brief, and keep the properties and decisions together.</p><div class="panel"><h2>Who are you helping buy?</h2><p class="muted">Create a client and engagement to start. No example data is loaded.</p><button class="primary" data-action="new-client">Create your first client →</button><div class="start-steps"><div><span class="eyebrow">01 / Capture</span><p>Upload or paste your transcript.</p></div><div><span class="eyebrow">02 / Brief</span><p>Review and record the buyer’s requirements.</p></div><div><span class="eyebrow">03 / Assess</span><p>Add real candidates, review them and choose the next action.</p></div></div></div>${workspaceTools()}</section>`;}
function capture(){const e=active();return `<div class="intro"><div class="eyebrow">Step 1 / Capture the conversation</div><h1>Keep the buyer’s words<br>close to the brief.</h1><p>Upload a transcript or paste the conversation. It stays attached to ${esc(e.name)}.</p></div><div class="a-intake"><section class="panel stack"><div class="upload" data-drop><button data-action="upload-transcript">Upload your transcript</button><p>.txt, .md, .vtt or .srt · up to 1 MB</p></div><div><label for="transcript">${e.transcript.filename?esc(e.transcript.filename):'Or paste the conversation'}</label><textarea id="transcript" class="transcript" placeholder="Paste your own conversation here…">${esc(e.transcript.text)}</textarea><small>Changes are kept in this workspace as you type.</small></div><div class="row between"><span class="muted file-name" id="transcript-count">${e.transcript.text.length.toLocaleString()} characters</span><button class="primary" data-step="brief">Review buyer brief →</button></div></section><aside><div class="manual-note"><h3>Automatic extraction is not connected yet</h3><p>The model route is TBC. Uploaded text is real input, but it will not silently populate fields. Record the brief manually for now.</p></div><h3>What works in this version</h3><ol class="step-list"><li><span class="number">1</span><div><strong>Your own client and engagement</strong><p>Nothing depends on a prefilled household.</p></div></li><li><span class="number">2</span><div><strong>Your own brief and properties</strong><p>Enter unknown details later. Missing values stay unknown.</p></div></li><li><span class="number">3</span><div><strong>Your decisions and history</strong><p>Pass, shortlist or mark missed with a reason. Export the workspace to keep it.</p></div></li></ol></aside></div>`;}
function brief(){const b=active().brief;return `<div class="screen-title"><div class="eyebrow">Step 2 / Review the buyer brief</div><h1>Turn the conversation into a clear brief.</h1><p class="muted">Manual entry while automatic extraction is TBC. Leave unstated requirements blank; the app will not invent them.</p></div><div class="a-review"><section class="panel"><div class="eyebrow">Source conversation</div>${active().transcript.text?`<div class="current-source">${esc(active().transcript.text)}</div>`:'<p class="muted">No conversation attached. You can still record a brief manually.</p>'}<button class="link spacer" data-step="capture">Upload or change transcript →</button></section><section class="panel"><div class="eyebrow">Client & current engagement</div><div class="field-grid">${field('brief-client','Client / household','text',client().name)}${field('brief-engagement','Engagement name','text',active().name)}${field('brief-budget','Maximum purchase budget (AUD)','number',b.budget,'min="1" step="any" placeholder="Not specified"')}${field('brief-beds','Minimum bedrooms','number',b.beds,'min="0" step="1" placeholder="Not specified"')}<div class="wide"><label for="brief-areas">Search suburbs (comma-separated)</label><input id="brief-areas" value="${esc(b.areas.join(', '))}" placeholder="Any suburbs — not restricted to the examples"></div><div class="wide"><label for="brief-access">Step-free access required?</label>${accessSelect('brief-access',b.stepFree)}</div><div class="wide"><label for="brief-notes">Other priorities / must-haves</label><textarea id="brief-notes" placeholder="Keep the nuance that does not fit a field.">${esc(b.notes)}</textarea></div></div><p class="speech-note">Client name follows the lasting profile. Budget and requirements belong to this engagement. Notes are retained but are not automatically scored.</p><div id="brief-error" class="form-error" role="alert"></div><div class="brief-form-footer"><button class="quiet" data-step="capture">← Conversation</button><button class="primary" data-action="save-brief">Save brief & review properties →</button></div></section></div>`;}
function board(){const list=records(),pending=list.filter(r=>r.status==='To review'),shortlisted=list.filter(r=>r.status==='Shortlisted');const groups=['To review','On hold','Shortlisted','Passed','Missed'];return `<div class="row between"><div><div class="eyebrow">Step 3 / The engagement’s property search</div><h1>Keep the next decision in view.</h1><p class="muted">${list.length} linked ${list.length===1?'property':'properties'} · ${esc(client().name)} / ${esc(active().name)}</p></div><div class="toolbar"><button data-action="add-property">Add property +</button>${state.properties.some(p=>!list.some(r=>r.propertyId===p.id))?'<button data-action="attach-existing">Link existing property</button>':''}<button data-step="shortlist">View shortlist →</button></div></div><div class="b-banner"><div><strong>${!active().briefReviewed?'First, record the buyer’s brief':!list.length?'Add the first candidate':pending.length?'Next: review the buyer’s candidates':shortlisted.length?'The shortlist is ready for another look':'Keep the search moving'}</strong><p>${!active().briefReviewed?'You can add properties now; fit stays incomplete until requirements are recorded.':!list.length?'Enter a property from a listing, agent conversation or your own research.':pending.length?pending.length+' awaiting a decision. Open one to inspect the details and record an outcome.':shortlisted.length?'Review the reasons and open questions before discussing them with the buyer.':'All linked candidates have an outcome. Add another property when one comes along.'}</p></div><button class="primary" data-action="${!active().briefReviewed?'go-brief':!list.length?'add-property':pending.length?'review-next':shortlisted.length?'go-shortlist':'add-property'}">${!active().briefReviewed?'Review brief →':!list.length?'Add your first property →':pending.length?'Review next property →':shortlisted.length?'Review shortlist →':'Add another property +'}</button></div>${briefChips()}<div class="board-scroll"><div class="board">${groups.map(status=>{const items=list.filter(r=>r.status===status);return `<section class="board-column"><div class="board-title">${status}<span>${items.length}</span></div>${items.length?items.map(r=>{const p=property(r.propertyId);return `<button class="board-card" data-open-property="${p.id}"><h3>${esc(p.label)}</h3><p class="muted">${esc(p.suburb)}</p><div class="property-price">${money(p.price)}</div><div style="margin-top:13px">${fitBadge(p.id)}</div><small style="display:block;margin-top:9px">${r.assessed?'Assessment recorded':'Not yet assessed'}</small>${r.reason?'<p class="muted" style="margin-top:10px">'+esc(r.reason)+'</p>':''}${r.tags.length?'<div class="tagline">'+r.tags.map(t=>'<span class="chip">'+esc(t)+'</span>').join('')+'</div>':''}</button>`;}).join(''):'<div class="board-empty">No properties here yet</div>'}</section>`;}).join('')}</div></div>`;}
function shortlist(){const list=records().filter(r=>r.status==='Shortlisted');return `<div class="row between screen-title"><div><div class="eyebrow">Step 4 / The buyer’s shortlist</div><h1>The options worth discussing.</h1><p class="muted">${list.length} shortlisted · ${esc(client().name)} / ${esc(active().name)}</p></div><button data-step="properties">Back to property board →</button></div><p class="shortlist-note">These are your recommendations based on entered information. Open questions remain visible. No live property data or independent checks have been fetched.</p>${list.length?list.map(r=>`<article class="panel shortlist-row"><div><h2>${esc(property(r.propertyId).label)}</h2><p class="muted">${esc(property(r.propertyId).suburb)} · ${money(property(r.propertyId).price)}</p>${fitBadge(r.propertyId)}<p class="spacer">${esc(r.reason)}</p>${r.nextAction?'<small>Next: '+esc(r.nextAction)+'</small>':''}</div><button class="primary" data-open-property="${r.propertyId}">Review evidence & history →</button></article>`).join(''):'<div class="panel empty"><h2>No shortlisted properties yet.</h2><p>Add and assess a candidate, then record why it deserves a place here.</p><button class="primary" data-step="properties">Go to property board →</button></div>'}`;}
function historyView(){return `<div class="eyebrow">Lasting client history</div><h1>Every outcome stays with the client.</h1><p class="muted">${esc(client().name)} · decisions remain specific to their buying engagement.</p>${state.engagements.filter(e=>e.clientId===client().id).map(e=>`<section class="panel history-group"><h2>${esc(e.name)}</h2>${state.assessments.filter(r=>r.engagementId===e.id).map(r=>`<div class="history-row"><div class="row between"><strong>${esc(property(r.propertyId).label)}</strong>${badge(r.status)}</div><p>${esc(r.reason||r.reviewNote||'No assessment recorded yet.')}${r.nextAction?'<br>Next: '+esc(r.nextAction):''}</p><small>${r.history.length} history entries · ${r.assessed?'assessed':'not yet assessed'}</small><br><button class="link spacer" data-history-engagement="${e.id}" data-id="${r.propertyId}">Open this assessment →</button></div>`).join('')||'<p class="muted">No properties linked to this engagement yet.</p>'}</section>`).join('')}`;}
function shell(){return `<div class="a-shell"><aside class="a-rail"><div class="logo"><span class="logo-symbol"></span>buyers desk</div><div class="rail-clients"><div class="rail-label">Your engagements</div>${state.engagements.map(e=>`<button class="${e.id===state.activeEngagementId?'selected':''}" data-context="${e.id}">${esc(state.clients.find(c=>c.id===e.clientId).name)}<small>${esc(e.name)}</small></button>`).join('')||'<div class="rail-empty">Your clients will appear here.</div>'}<button class="rail-action" data-action="new-client">New client +</button>${state.clients.length?'<button data-action="new-engagement">New engagement +</button>':''}</div>${active()?'<div class="rail-current"><div class="rail-label">This client</div><button data-step="history">Property history →</button></div>':''}<div class="rail-bottom">A+B hybrid · working prototype<br>Automatic extraction: not connected</div></aside><main class="a-content"><div class="a-top"><div><small>CLIENT WORKSPACE</small><h3 style="margin:4px 0">${active()?esc(client().name):'Start your workspace'}</h3></div><div class="row"><span class="prototype-pill">Hybrid A+B</span>${active()?`<select class="context-select" id="engagement-select" aria-label="Client and engagement">${state.engagements.map(e=>`<option value="${e.id}" ${e.id===state.activeEngagementId?'selected':''}>${esc(state.clients.find(c=>c.id===e.clientId).name)} · ${esc(e.name)}</option>`).join('')}</select><button class="quiet navsmall" data-action="new-client">New client +</button>`:''}</div></div><div class="a-stage">${active()?`${steps()}${ui.step==='capture'?capture():ui.step==='brief'?brief():ui.step==='properties'?board():ui.step==='shortlist'?shortlist():historyView()}${workspaceTools()}`:emptyScreen()}</div></main></div>`;}
function propertyDrawer(){if(!ui.drawerId)return '';const p=property(ui.drawerId),r=record(p.id);return `<dialog id="property-drawer" class="inspector"><div class="row between"><small>${esc(client().name)} / ${esc(active().name)}</small><button data-action="close-drawer" aria-label="Close property">×</button></div><div class="eyebrow spacer">Property assessment</div><h2>${esc(p.label)}</h2><p class="muted">${esc(p.suburb)}</p><div class="row between"><span class="property-price">${money(p.price)}</span>${badge(r.status)}</div><p class="speech-note">Fit compares your entered details with the current brief. It is not independent verification.</p>${fit(p.id).map(f=>`<div class="factrow"><div><strong>${esc(f.name)}</strong><small>Brief: ${esc(f.want)}</small><small>Found: ${esc(f.found)}</small></div>${badge(f.status)}</div>`).join('')}<div class="source-box"><strong>Property source / notes</strong><br>${esc(p.source||'No source supplied.')}<br><button class="link small-link spacer" data-action="edit-property">Edit property details →</button></div><div class="outcomes spacer"><button class="primary" data-outcome="Shortlisted">Shortlist</button><button data-outcome="On hold">Hold</button><button data-outcome="Passed">Pass</button><button class="quiet" data-outcome="Missed">Missed</button></div><div class="status-tools"><small>${r.assessed?'Assessment recorded':'Not yet assessed'}</small><button class="link" data-outcome="assessed">Record assessment</button></div>${r.reviewNote?'<p class="record-caption">Assessment: '+esc(r.reviewNote)+'</p>':''}${r.reason?'<p class="record-caption">Decision reason: '+esc(r.reason)+'</p>':''}${r.nextAction?'<p class="source-box">Next: '+esc(r.nextAction)+'</p>':''}<div class="tagline">${r.tags.map(t=>`<span class="chip">${esc(t)} <button data-remove-tag="${esc(t)}" aria-label="Remove ${esc(t)}">×</button></span>`).join('')}</div><div class="tags-input"><input id="new-tag" placeholder="Tag for this engagement" aria-label="Property assessment tag" maxlength="60"><button data-action="add-tag">Add tag</button></div><details open class="source-detail spacer"><summary>Decision history · ${r.history.length}</summary><ul class="timeline">${r.history.map(h=>`<li><strong>${esc(h.action)}</strong><p>${esc(h.note)}${h.nextAction?'<br>Next: '+esc(h.nextAction):''}</p><small>${esc(new Date(h.at).toLocaleString('en-AU',{timeZone:'Australia/Brisbane'}))}</small></li>`).join('')}</ul></details></dialog>`;}
function modal(){if(!ui.modal)return '';let title='',content='',save='';
if(ui.modal==='client'){title=ui.newEngagement?'Start another engagement':'Create a client';content=`<div class="field-grid">${ui.newEngagement?`<div class="wide"><label for="existing-client">Client / household</label><select id="existing-client">${state.clients.map(c=>`<option value="${c.id}" ${c.id===client()?.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`:`<div class="wide">${field('new-client-name','Client / household name','text','','placeholder="Your client’s name"')}</div>`}<div class="wide">${field('new-engagement-name','Buying engagement name','text','','placeholder="e.g. Family home search"')}</div></div>`;save='create-client';}
if(ui.modal==='property'){const p=ui.editPropertyId?property(ui.editPropertyId):null;title=p?'Edit property details':'Add a property';content=`${p?'<p class="hint">Property facts are shared across engagements. Each engagement retains its own decisions.</p>':''}<div class="field-grid"><div class="wide">${field('property-label','Address / property label','text',p?.label,'placeholder="e.g. 18 Example Street"')}</div>${field('property-suburb','Suburb','text',p?.suburb)}${field('property-price','Asking price / guide (AUD)','number',p?.price,'min="1" step="any" placeholder="Unknown"')}${field('property-beds','Bedrooms','number',p?.beds,'min="0" step="1" placeholder="Unknown"')}<div><label for="property-access">Step-free access?</label>${accessSelect('property-access',p?.stepFree)}</div><div class="wide"><label for="property-source">Source / property notes</label><textarea id="property-source" placeholder="Listing URL, selling-agent note, inspection observation…">${esc(p?.source||'')}</textarea></div></div>`;save='save-property';}
if(ui.modal==='attach'){title='Link an existing property';content=`<p class="muted">Creates a fresh assessment for this engagement. Other clients’ decisions are not copied.</p><label for="existing-property">Property</label><select id="existing-property">${state.properties.filter(p=>!records().some(r=>r.propertyId===p.id)).map(p=>`<option value="${p.id}">${esc(p.label+' · '+p.suburb)}</option>`).join('')}</select>`;save='save-attachment';}
if(ui.modal==='outcome'){const r=record(ui.drawerId);title=ui.decision==='assessed'?'Record assessment':ui.decision==='Missed'?'Record a missed property':'Record decision: '+ui.decision;content=`<p class="muted">${esc(property(ui.drawerId).label)} / ${esc(client().name)}</p>${ui.decision==='Missed'?'<div class="hint" style="margin-bottom:20px">Missed means unavailable or lost out. Choosing not to pursue is a pass.</div>':''}<label for="outcome-reason">${ui.decision==='assessed'?'Assessment note':'Reason for this outcome'}</label><textarea id="outcome-reason">${esc(ui.decision==='assessed'?r.reviewNote:r.reason)}</textarea><label for="outcome-next" style="margin-top:16px">Next action</label><input id="outcome-next" value="${esc(r.nextAction)}" placeholder="Who needs to do what next?"><p class="speech-note">A hold or a shortlist with unresolved fit needs a next action.</p>`;save='save-outcome';}
if(ui.modal==='about'){title='A working hybrid, with clear limits';content=`<p>A’s client workspace and guided intake, with B’s property board and detail drawer.</p><p>You can create clients and engagements, upload or paste text, enter a brief, add/edit/link properties, record outcomes and tags, and export/import your workspace. It starts empty.</p><p><strong>Automatic NLP/ML extraction is not connected.</strong> The model route is TBC. Transcripts are retained as source text; brief entry is manual. Nothing is sent to a service.</p><p>Records live in memory in this tab. Export a workspace file to keep them and open it later. Exported files contain the information you entered. No production data service, account, CRM, live listing feed or external verification is connected.</p><p class="muted">Buywell has not participated; HighLevel is unconfirmed. This prototype does not establish real agency adoption or workflow accuracy.</p><div class="row"><button data-action="load-examples">Load optional fictional examples</button><button data-action="clear-workspace">Clear workspace</button></div>`;}
return `<dialog id="modal" class="modal wide-modal"><button class="close" data-action="close-modal" aria-label="Close">×</button><div class="eyebrow">${ui.modal==='about'?'Working prototype':'Keep the record in context'}</div><h2>${esc(title)}</h2>${content}<div id="modal-error" class="form-error" role="alert"></div><div class="modal-footer"><button data-action="close-modal">${save?'Cancel':'Close'}</button>${save?`<button class="primary" data-action="${save}">Save ${ui.modal==='client'?'& start →':ui.modal==='property'?'property →':'record →'}</button>`:''}</div></dialog>`;}
function render(){const scrollY=window.scrollY;$('app').innerHTML=shell()+propertyDrawer()+modal();if(ui.drawerId)$('property-drawer').showModal();if(ui.modal)$('modal').showModal();if(ui.step==='capture')wireDrop();window.scrollTo(0,scrollY);}
let toastTimer;function notify(message){$('notice').textContent=message;$('notice').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('notice').hidden=true,4000);}
function log(r,action,note,nextAction=''){r.history.push({action,note,nextAction,at:new Date().toISOString()});}
function attach(pid){if(!active()||!property(pid)||records().some(r=>r.propertyId===pid))return false;const r={id:id(),engagementId:active().id,propertyId:pid,status:'To review',assessed:false,reviewNote:'',reason:'',nextAction:'',tags:[],history:[]};log(r,'Attached','Property linked to this buying engagement.');state.assessments.push(r);return true;}
function openModal(name){ui.modal=name;render();}
function inputValue(name){return $(name).value.trim();}
function numeric(name,integer=false){const raw=inputValue(name);if(!raw)return null;const n=Number(raw);if(!Number.isFinite(n)||(integer?!Number.isInteger(n)||n<0:n<=0))throw Error(integer?'Use a whole, non-negative bedroom count.':'Enter a positive amount, or leave it blank.');return n;}
function bool(name){return $(name).value===''?null:$(name).value==='yes';}
function createClient(){const name=ui.newEngagement?'':inputValue('new-client-name'),engName=inputValue('new-engagement-name');if((!ui.newEngagement&&!name)||!engName)throw Error('Enter the client and engagement names.');let clientId=ui.newEngagement?$('existing-client').value:id();if(!ui.newEngagement)state.clients.push({id:clientId,name});const engagement={id:id(),clientId,name:engName,brief:blankBrief(),briefReviewed:false,transcript:{text:'',filename:''}};state.engagements.push(engagement);state.activeEngagementId=engagement.id;ui.step='capture';ui.modal=null;ui.drawerId=null;render();window.scrollTo(0,0);notify('Engagement created. Bring in a conversation or record the brief manually.');}
function saveBrief(){const name=inputValue('brief-client'),engagementName=inputValue('brief-engagement');if(!name||!engagementName)throw Error('Client and engagement names are required.');const b={budget:numeric('brief-budget'),beds:numeric('brief-beds',true),areas:inputValue('brief-areas').split(',').map(x=>x.trim()).filter(Boolean),stepFree:bool('brief-access'),notes:inputValue('brief-notes')};client().name=name;active().name=engagementName;active().brief=b;active().briefReviewed=true;ui.step='properties';render();window.scrollTo(0,0);notify('Brief saved. Add or review properties against your requirements.');}
function saveProperty(){const label=inputValue('property-label'),suburb=inputValue('property-suburb');if(!label||!suburb)throw Error('Enter a property label/address and suburb.');const data={label,suburb,price:numeric('property-price'),beds:numeric('property-beds',true),stepFree:bool('property-access'),source:inputValue('property-source')};if(ui.editPropertyId)Object.assign(property(ui.editPropertyId),data);else{const p={id:id(),...data};state.properties.push(p);attach(p.id);}ui.modal=null;ui.editPropertyId=null;ui.step='properties';render();notify('Property saved. Your entered facts now drive the fit comparison.');}
function saveOutcome(){const r=record(ui.drawerId),reason=inputValue('outcome-reason'),next=inputValue('outcome-next');if(!reason)throw Error('Record a reason or assessment note.');if((ui.decision==='On hold'||ui.decision==='Shortlisted'&&unresolved(r.propertyId))&&!next)throw Error('A hold or unresolved shortlist needs an explicit next action.');if(ui.decision==='assessed'){r.assessed=true;r.reviewNote=reason;log(r,'Assessed',reason,next);}else{r.status=ui.decision;r.reason=reason;log(r,ui.decision,reason,next);}r.nextAction=next;ui.modal=null;ui.drawerId=null;render();notify('Outcome recorded with its reason and history.');}
function switchContext(engagementId){if(!state.engagements.some(e=>e.id===engagementId))return;state.activeEngagementId=engagementId;ui.drawerId=null;ui.modal=null;ui.step=active().briefReviewed?'properties':'capture';render();window.scrollTo(0,0);}
async function loadTranscript(file){if(!file)return;if(!/\.(txt|md|vtt|srt)$/i.test(file.name)||file.size>1000000){notify('Use a .txt, .md, .vtt or .srt text transcript under 1 MB.');return;}const engagement=active();if(!engagement)return;try{const text=await file.text();engagement.transcript={text,filename:file.name};if(active()?.id===engagement.id){ui.step='capture';render();notify('Your transcript is loaded. Review the brief manually while extraction is TBC.');}}catch{notify('The file could not be read. Try pasting the transcript.');}}
function wireDrop(){document.querySelectorAll('[data-drop]').forEach(zone=>{zone.addEventListener('dragover',event=>{event.preventDefault();zone.classList.add('drag');});zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));zone.addEventListener('drop',event=>{event.preventDefault();loadTranscript(event.dataTransfer.files[0]);});});}
function validateWorkspace(value){if(value?.version!==1||!value.workspace)throw Error('Use a workspace file exported by this hybrid.');const s=value.workspace;for(const key of ['clients','engagements','properties','assessments'])if(!Array.isArray(s[key]))throw Error('Workspace records are missing.');const unique=items=>items.every((item,i)=>typeof item.id==='string'&&items.findIndex(other=>other.id===item.id)===i);if(![s.clients,s.engagements,s.properties,s.assessments].every(unique))throw Error('Workspace IDs must be present and unique.');for(const c of s.clients)if(typeof c.name!=='string')throw Error('Invalid client.');for(const e of s.engagements){if(!s.clients.some(c=>c.id===e.clientId)||typeof e.name!=='string'||!e.brief||!Array.isArray(e.brief.areas)||!e.brief.areas.every(a=>typeof a==='string')||typeof e.brief.notes!=='string'||typeof e.transcript?.text!=='string')throw Error('Invalid engagement.');for(const key of ['budget','beds'])if(e.brief[key]!==null&&(!Number.isFinite(e.brief[key])||e.brief[key]<0))throw Error('Invalid brief amount.');if(![null,true,false].includes(e.brief.stepFree))throw Error('Invalid access requirement.');}
for(const p of s.properties){if(typeof p.label!=='string'||typeof p.suburb!=='string'||typeof p.source!=='string'||![null,true,false].includes(p.stepFree))throw Error('Invalid property.');for(const key of ['price','beds'])if(p[key]!==null&&(!Number.isFinite(p[key])||p[key]<0))throw Error('Invalid property number.');}
for(const r of s.assessments){if(!s.engagements.some(e=>e.id===r.engagementId)||!s.properties.some(p=>p.id===r.propertyId)||!['To review','On hold','Shortlisted','Passed','Missed'].includes(r.status)||!Array.isArray(r.tags)||!r.tags.every(t=>typeof t==='string')||!Array.isArray(r.history)||!r.history.every(h=>typeof h.action==='string'&&typeof h.note==='string'&&typeof h.at==='string')||typeof r.reason!=='string'||typeof r.reviewNote!=='string'||typeof r.nextAction!=='string')throw Error('Invalid property assessment.');}
if(s.assessments.some((r,i)=>s.assessments.some((other,j)=>i!==j&&r.engagementId===other.engagementId&&r.propertyId===other.propertyId)))throw Error('Duplicate property links.');if(s.activeEngagementId!==null&&!s.engagements.some(e=>e.id===s.activeEngagementId))throw Error('Active engagement is missing.');return s;}
function exportWorkspace(){const blob=new Blob([JSON.stringify({version:1,workspace:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='buyers-desk-workspace.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Workspace exported. Keep the file to reopen your records.');}
async function importWorkspace(file){if(!file)return;if(file.size>10000000){notify('Use a workspace file smaller than 10 MB.');return;}try{const next=validateWorkspace(JSON.parse(await file.text()));if(state.clients.length&&!confirm('Replace the current tab’s workspace? Export it first if you want to keep it.'))return;state=next;ui.drawerId=null;ui.modal=null;ui.step=active()?.briefReviewed?'properties':'capture';render();window.scrollTo(0,0);notify('Workspace opened. Your client records and property history are restored.');}catch(error){notify(error.message||'Could not open that workspace file.');}}
function loadExamples(){if(state.clients.length&&!confirm('Replace this workspace with fictional examples? Export it first to keep your records.'))return;const cid=id(),eid=id();state=empty();state.clients.push({id:cid,name:'Example household'});state.engagements.push({id:eid,clientId:cid,name:'Fictional family home search',brief:{budget:1200000,beds:3,areas:['Indooroopilly','Taringa'],stepFree:true,notes:'Fictional example only.'},briefReviewed:true,transcript:{text:'Fictional example: a household wants a three-bedroom home under $1.2m in Indooroopilly or Taringa, with step-free access.',filename:''}});state.activeEngagementId=eid;for(const [label,suburb,price,beds,stepFree]of[['Fictional candidate A','Indooroopilly',1150000,3,null],['Fictional candidate B','Taringa',1090000,2,true],['Fictional candidate C','Taringa',1180000,3,true]]){const pid=id();state.properties.push({id:pid,label,suburb,price,beds,stepFree,source:'Invented illustration, not an actual listing.'});attach(pid);}ui.modal=null;ui.step='properties';render();notify('Optional fictional examples loaded.');}
document.addEventListener('input',event=>{if(event.target.id==='transcript'&&active()){active().transcript.text=event.target.value;$('transcript-count').textContent=event.target.value.length.toLocaleString()+' characters';}});
document.addEventListener('change',event=>{if(event.target.id==='engagement-select')switchContext(event.target.value);});
$('transcript-file').addEventListener('change',event=>{loadTranscript(event.target.files[0]);event.target.value='';});$('workspace-file').addEventListener('change',event=>{importWorkspace(event.target.files[0]);event.target.value='';});
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.context)switchContext(b.dataset.context);if(b.dataset.step&&active()){ui.step=b.dataset.step;ui.modal=null;ui.drawerId=null;render();window.scrollTo(0,0);}if(b.dataset.openProperty){ui.drawerId=b.dataset.openProperty;render();}if(b.dataset.historyEngagement){state.activeEngagementId=b.dataset.historyEngagement;ui.drawerId=b.dataset.id;render();}if(b.dataset.outcome){ui.decision=b.dataset.outcome;openModal('outcome');}
if(b.dataset.removeTag){const r=record(ui.drawerId),tag=b.dataset.removeTag;r.tags=r.tags.filter(t=>t!==tag);log(r,'Tag removed',tag);render();}
const action=b.dataset.action;try{
if(action==='new-client'){ui.newEngagement=false;openModal('client');}if(action==='new-engagement'){ui.newEngagement=true;openModal('client');}if(action==='create-client')createClient();
if(action==='upload-transcript')$('transcript-file').click();if(action==='save-brief')saveBrief();if(action==='go-brief'){ui.step='brief';render();window.scrollTo(0,0);}if(action==='go-shortlist'){ui.step='shortlist';render();}
if(action==='add-property'){ui.editPropertyId=null;openModal('property');}if(action==='edit-property'){ui.editPropertyId=ui.drawerId;openModal('property');}if(action==='save-property')saveProperty();if(action==='attach-existing')openModal('attach');if(action==='save-attachment'){if(!attach($('existing-property').value))throw Error('This property is already linked.');ui.modal=null;render();notify('Property linked with a fresh assessment.');}
if(action==='review-next'){const next=records().find(r=>r.status==='To review');if(next){ui.drawerId=next.propertyId;render();}}if(action==='save-outcome')saveOutcome();
if(action==='add-tag'){const tag=inputValue('new-tag'),r=record(ui.drawerId);if(!tag)throw Error('Enter a tag first.');if(r.tags.some(t=>t.toLowerCase()===tag.toLowerCase()))throw Error('That tag is already on this assessment.');r.tags.push(tag);log(r,'Tagged',tag);render();}
if(action==='close-drawer'){ui.drawerId=null;ui.modal=null;render();}if(action==='close-modal'){ui.modal=null;render();}if(action==='about')openModal('about');if(action==='export')exportWorkspace();if(action==='import')$('workspace-file').click();if(action==='load-examples')loadExamples();if(action==='clear-workspace'){if(confirm('Clear this tab’s records? Export first if you want to keep them.')){state=empty();ui.modal=null;ui.drawerId=null;ui.step='capture';render();}}
}catch(error){const target=action==='save-brief'?$('brief-error'):$('modal-error');if(target)target.textContent=error.message;else notify(error.message);}});
document.addEventListener('cancel',event=>{if(event.target.id==='modal')ui.modal=null;if(event.target.id==='property-drawer')ui.drawerId=null;},true);
render();
</script></html>
