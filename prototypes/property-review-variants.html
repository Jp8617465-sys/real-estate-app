<script>
/* Portable prototype logic. No DOM, storage, network or clock dependencies. */
const Review = (() => {
  const clients = [{id:'hart',name:'Hart household'},{id:'singh',name:'Singh household'}];
  const engagements = [
    {id:'home',clientId:'hart',name:'Family home · active search',budget:1200000,beds:3,areas:['Indooroopilly','Taringa'],stepFree:true},
    {id:'investment',clientId:'hart',name:'Investment · separate engagement',budget:950000,beds:2,areas:['Indooroopilly','Taringa','Mitchelton'],stepFree:false},
    {id:'relocation',clientId:'singh',name:'Relocation · active search',budget:1250000,beds:2,areas:['Indooroopilly','Taringa','Mitchelton'],stepFree:false}
  ];
  const fact = (value,source,observed='6 Nov 2026, 09:00',retrieved='6 Nov 2026, 09:10') => ({value,source,observed,retrieved});
  const newRecord = (engagementId,propertyId) => ({engagementId,propertyId,assessment:'To assess',decision:'Undecided',reason:'',nextAction:'',tags:[],history:[{action:'Attached',note:'Added to this engagement.',nextAction:''}]});
  const initial = () => ({
    clients:structuredClone(clients),engagements:structuredClone(engagements),activeEngagementId:'home',selectedPropertyId:'a',
    properties:[
      {id:'a',name:'Candidate A',area:'Indooroopilly',facts:{price:[fact(1150000,'Illustrative listing extract A')],beds:[fact(3,'Illustrative listing extract A')],area:[fact('Indooroopilly','Illustrative listing extract A')],stepFree:[]}},
      {id:'b',name:'Candidate B',area:'Taringa',facts:{price:[fact(1090000,'Illustrative listing extract B')],beds:[fact(2,'Illustrative inspection note B')],area:[fact('Taringa','Illustrative listing extract B')],stepFree:[fact(true,'Illustrative inspection note B')]}},
      {id:'c',name:'Candidate C',area:'Taringa',facts:{price:[fact(1180000,'Illustrative listing extract C')],beds:[fact(3,'Illustrative listing extract C')],area:[fact('Taringa','Illustrative listing extract C')],stepFree:[fact(true,'Illustrative selling-agent note C','5 Nov 2026, 16:00'),fact(false,'Illustrative inspection note C','6 Nov 2026, 09:00')]}}
    ],
    records:[newRecord('home','a'),newRecord('home','b'),newRecord('home','c'),{...newRecord('investment','a'),assessment:'Assessed',decision:'Passed',reason:'Over this engagement’s $950,000 budget.',history:[{action:'Passed',note:'Over this engagement’s $950,000 budget.',nextAction:''}]},newRecord('relocation','b')],message:'Choose a property, or start a guided walkthrough below.',error:false
  });
  const active = s => s.engagements.find(e=>e.id===s.activeEngagementId);
  const record = s => s.records.find(r=>r.engagementId===s.activeEngagementId&&r.propertyId===s.selectedPropertyId);
  const evaluate = (s,propertyId,engagementId=s.activeEngagementId) => {
    const p=s.properties.find(p=>p.id===propertyId),e=s.engagements.find(e=>e.id===engagementId);
    const criteria=[{key:'price',name:'Price guide',want:'At or below $'+e.budget.toLocaleString('en-AU'),check:v=>v<=e.budget},{key:'beds',name:'Bedrooms',want:e.beds+' or more',check:v=>v>=e.beds},{key:'area',name:'Location',want:e.areas.join(' / '),check:v=>e.areas.includes(v)}];
    if(e.stepFree)criteria.push({key:'stepFree',name:'Step-free access',want:'Required',check:v=>v===true});
    return criteria.map(c=>{const facts=p.facts[c.key],values=[...new Set(facts.map(f=>f.value))];return {...c,facts,status:!values.length?'Unknown':values.length>1?'Conflict':c.check(values[0])?'Match':'Mismatch'};});
  };
  const transition = (state,action) => {
    const s=structuredClone(state);s.error=false;
    const reject=message=>({...state,message,error:true});
    const log=(r,label,note,nextAction='')=>r.history.push({action:label,note,nextAction});
    if(action.type==='context'){
      if(!s.engagements.some(e=>e.id===action.id))return reject('Choose a known engagement.');
      s.activeEngagementId=action.id;s.selectedPropertyId=s.records.find(r=>r.engagementId===action.id)?.propertyId||s.properties[0].id;
      s.message='Context changed. Each engagement keeps its own brief, tags and decisions.';return s;
    }
    if(action.type==='select'){
      if(!s.records.some(r=>r.engagementId===s.activeEngagementId&&r.propertyId===action.id))return reject('Attach the property before reviewing it here.');
      s.selectedPropertyId=action.id;s.message='Viewing the property’s assessment in this engagement.';return s;
    }
    if(action.type==='attach'){
      if(!s.properties.some(p=>p.id===action.id))return reject('Choose a known property.');
      if(s.records.some(r=>r.engagementId===s.activeEngagementId&&r.propertyId===action.id))return reject('Already attached to this engagement. No duplicate created.');
      s.records.push(newRecord(s.activeEngagementId,action.id));s.selectedPropertyId=action.id;s.message='Property attached to this engagement and visible in the client history. Other engagements are unchanged.';return s;
    }
    const r=record(s);if(!r)return reject('Attach a property to this engagement first.');
    if(action.type==='confirmAccess'){
      if(s.selectedPropertyId!=='a')return reject('This illustrative confirmation belongs to Candidate A.');
      if(s.properties.find(p=>p.id==='a').facts.stepFree.length)return reject('The example confirmation is already recorded.');
      s.properties.find(p=>p.id==='a').facts.stepFree.push(fact(true,'Illustrative inspection confirmation A','6 Nov 2026, 10:00','6 Nov 2026, 10:05'));
      log(r,'Evidence added','Step-free access confirmed in the illustrative inspection note.');s.message='Property evidence added. Fit now uses that evidence in every linked engagement; each engagement’s decision stays unchanged.';return s;
    }
    if(action.type==='tag'){
      const tag=(action.value||'').trim();if(!tag)return reject('Enter a tag first.');
      if(r.tags.some(t=>t.toLowerCase()===tag.toLowerCase()))return reject('This tag is already on this engagement’s assessment.');
      r.tags.push(tag);log(r,'Tagged',tag);s.message='Tag added to this engagement’s property assessment.';return s;
    }
    if(action.type==='removeTag'){
      r.tags=r.tags.filter(t=>t!==action.value);log(r,'Tag removed',action.value);s.message='Tag removed from this assessment only.';return s;
    }
    const reason=(action.reason||'').trim(),nextAction=(action.nextAction||'').trim();
    if(action.type==='assess'){
      if(!reason)return reject('Add an assessment note before marking the property assessed.');
      r.assessment='Assessed';r.reason=reason;r.nextAction=nextAction;log(r,'Assessed',reason,nextAction);
      s.message='Review recorded. “Assessed” does not mean the property fits or should be purchased.';return s;
    }
    if(action.type==='decide'){
      if(!['Shortlisted','On hold','Passed','Missed'].includes(action.value))return reject('Choose a known decision.');
      if(!reason)return reject('Record a reason before changing the property decision.');
      const unresolved=evaluate(s,r.propertyId).some(c=>c.status!=='Match');
      if((action.value==='On hold'||action.value==='Shortlisted'&&unresolved)&&!nextAction)return reject('A hold or unresolved shortlist needs a next action. Keep the evidence gap explicit.');
      r.decision=action.value;r.reason=reason;r.nextAction=nextAction;log(r,action.value,reason,nextAction);
      s.message=action.value==='Missed'?'Marked missed for this engagement. Earlier decisions and evidence are retained.':action.value==='Passed'?'Passed for this engagement. The property stays in the client history.':action.value==='Shortlisted'&&unresolved?'Shortlisted with unresolved evidence. This is an explicit agent decision, not an automatic match.':'Decision recorded with its reason.';return s;
    }
    return reject('Choose an available action.');
  };
  return Object.freeze({initial,active,record,evaluate,transition});
})();
</script>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+n.toLocaleString('en-AU');
const variants={A:'Guided review',B:'Search board',C:'Client dossier'};
let variant=new URL(location.href).searchParams.get('variant')||'A';if(!variants[variant])variant='A';
let state=Review.initial();
const ui={step:'capture',drawer:false,decision:null,drafts:{},showHistory:false};
const sample=`Example consultation · fictional transcript\nAgent: Tell me who we are searching for.\nBuyer: We're Sam and Alex Hart. We are looking for a family home in Brisbane.\nBuyer: Our budget is $1.2m. We need at least 3 bedrooms.\nBuyer: Indooroopilly or Taringa would work for us. Step-free access is essential.\nAgent: I'll confirm access with the selling agents before we recommend a property.\nBuyer: We would like to move within six months.`;
const e=()=>Review.active(state),r=()=>Review.record(state),client=()=>state.clients.find(c=>c.id===e().clientId),records=()=>state.records.filter(x=>x.engagementId===e().id);
const draft=()=>ui.drafts[e().id]||(ui.drafts[e().id]={text:'',filename:'',fields:null,approved:false});
const property=id=>state.properties.find(p=>p.id===id);
const description={a:'Garden-side family home',b:'A smaller home, a familiar suburb',c:'A promising home with an open question'};
function illustration(id){const palettes={a:['#dce8db','#b5c8b0','#ece6d8','#698376'],b:['#e2e7f0','#bcc9de','#e5dcd1','#6e8195'],c:['#eee2d4','#cdb99e','#eee8db','#8f8975']};const [sky,tree,wall,roof]=palettes[id];return `<svg class="property-art" viewBox="0 0 500 280" role="img" aria-label="Illustration for fictional Candidate ${id.toUpperCase()}"><rect width="500" height="280" fill="${sky}"/><circle cx="406" cy="61" r="28" fill="#fff9e4"/><path d="M0 204 Q90 164 179 198 T500 180V280H0Z" fill="${tree}"/><path d="M62 134L196 63L347 134Z" fill="${roof}"/><path d="M81 132H331V232H81Z" fill="${wall}"/><path d="M322 149H414V232H322Z" fill="#e1ded1"/><path d="M307 149L366 111L429 149Z" fill="${roof}"/><rect x="108" y="153" width="65" height="48" rx="2" fill="#78918c"/><path d="M140 153V201M108 176H173" stroke="#e8ece0" stroke-width="3"/><rect x="196" y="149" width="46" height="83" fill="#5c7468"/><rect x="263" y="153" width="44" height="48" fill="#8fa298"/><path d="M219 232L259 280H183Z" fill="#c5c6b5"/><path d="M17 226V109M465 220V124" stroke="#7c8f73" stroke-width="9"/><circle cx="20" cy="116" r="41" fill="${tree}"/><circle cx="461" cy="120" r="36" fill="${tree}"/><rect y="245" width="500" height="35" fill="#8fa28a" opacity=".45"/></svg>`;}
function badge(status){return `<span class="pill ${status==='Mismatch'?'bad':status==='Unknown'||status==='Conflict'?'warn':''}">${esc(status)}</span>`;}
function fitSummary(id){const unresolved=Review.evaluate(state,id).filter(x=>x.status!=='Match');return unresolved.length?badge(unresolved[0].status):badge('Matches brief');}
function contextSelect(){return `<div class="row"><select class="context-select" aria-label="Choose client and engagement" data-context>${state.engagements.map(x=>`<option value="${x.id}" ${x.id===e().id?'selected':''}>${esc(state.clients.find(c=>c.id===x.clientId).name)} · ${esc(x.name.split(' · ')[0])}</option>`).join('')}</select>${ui.step==='properties'&&state.properties.some(p=>!records().some(r=>r.propertyId===p.id))?'<button data-action="attach-candidate">Attach candidate +</button>':''}</div>`;}
function attachmentDialog(){const available=state.properties.filter(p=>!records().some(r=>r.propertyId===p.id));return `<dialog id="attach-dialog" class="modal"><div class="eyebrow">Add to this engagement</div><h2>Attach a candidate</h2><p class="muted">This creates a fresh assessment for ${esc(client().name)} / ${esc(e().name.split(' · ')[0])}. Other engagements keep their decisions.</p><label for="candidate-to-attach">Available fictional candidate</label><select id="candidate-to-attach">${available.map(p=>`<option value="${p.id}">${esc(p.name+' · '+p.area)}</option>`).join('')}</select><div class="modal-footer"><button data-action="close-attach">Cancel</button><button class="primary" data-action="save-attachment">Attach to engagement →</button></div></dialog>`;}
function briefChips(){return `<div class="brief-summary"><span class="chip">Up to ${money(e().budget)}</span><span class="chip">${e().beds}+ bedrooms</span><span class="chip">${esc(e().areas.join(' / '))}</span>${e().stepFree?'<span class="chip">Step-free access</span>':''}</div>`;}
function journey(){return `<div class="process-row" aria-label="Buying review journey">${[['capture','1','Conversation'],['review','2','Buyer brief'],['properties','3','Assess'],['shortlist','4','Shortlist']].map(([step,num,label],i)=>`${i?'<span class="muted">›</span>':''}<button data-step="${step}" class="${ui.step===step?'active':''}"><span class="step-circle">${num}</span>${label}</button>`).join('')}</div>`;}
function tabs(){return `<nav class="navtabs" aria-label="Engagement views">${[['capture','Conversation'],['review','Buyer brief'],['properties',variant==='C'?'Compare properties':'Properties'],['shortlist','Shortlist'],['history','History']].map(([step,label])=>`<button data-step="${step}" class="${ui.step===step?'active':''}">${label}${step==='shortlist'?' · '+records().filter(x=>x.decision==='Shortlisted').length:''}</button>`).join('')}</nav>`;}
function upload(){return `<div class="upload" data-drop><svg class="upload-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 21V5m-6 6 6-6 6 6M5 21v6h22v-6" stroke="currentColor" stroke-width="1.5"/></svg><button data-action="upload">Upload a transcript</button><p>Drop a .txt, .md, .vtt or .srt file · text only</p></div>`;}
function transcriptEditor(){return `<label for="transcript">${draft().filename?esc(draft().filename):'Or paste the conversation'}</label><textarea id="transcript" class="transcript" placeholder="Agent: What are you looking for?&#10;Buyer: Our budget is…">${esc(draft().text)}</textarea><div class="row between" style="margin-top:14px"><button class="quiet" data-action="sample">Use example conversation</button><button class="primary" data-action="extract">Extract suggestions →</button></div><p class="draft-foot">Prototype: local rule-based suggestions, not a connected ML service. Text stays in this browser session.</p>`;}
function fields(compact=false){const d=draft();if(!d.fields)return `<div class="empty"><div class="eyebrow">Nothing inferred yet</div><h3>Your buyer brief starts here.</h3><p>Upload or paste a conversation, then extract suggestions. Each field will show the words it came from.</p><button data-action="sample" class="primary">Try an example →</button></div>`;return `<div class="hint">${d.approved?'Applied to this engagement. You can revise and review again.':'Suggestions need your review. Uncertainty stays visible.'}</div>${d.fields.map((f,i)=>`<div class="field"><label for="field-${i}">${esc(f.label)}</label><input id="field-${i}" data-field="${i}" value="${esc(f.value)}" placeholder="${esc(f.placeholder)}"><div class="quote">${esc(f.quote||'No supporting buyer statement found. Enter and verify this detail manually.')}</div>${f.conflict?'<span class="pill warn">Multiple values — resolve before accepting</span>':''}<label class="check"><input type="checkbox" data-accept="${i}" ${f.accepted?'checked':''}>I’ve checked this ${f.conflict?'and resolved the ambiguity':'against the conversation'}</label></div>`).join('')}<p class="draft-foot">Updates ${esc(client().name)} and this engagement’s brief only. Property outcomes remain attached to their existing engagements.</p><button class="primary" data-action="apply" style="width:100%;margin-top:12px">Apply reviewed brief →</button>`;}
function sources(id){return `<details class="source-detail"><summary>Inspect the source evidence</summary>${Review.evaluate(state,id).map(c=>`<p><strong>${esc(c.name)} · ${esc(c.status)}</strong>${c.facts.map(f=>`<br>${esc(f.source)} — ${esc(typeof f.value==='boolean'?(f.value?'Yes':'No'):f.value)}<br>Observed ${esc(f.observed)} · retrieved ${esc(f.retrieved)}`).join('')||'<br>No supporting fact.'}</p>`).join('')}</details>`;}
function factValue(c){return c.facts.length?c.facts.map(f=>c.key==="price"?money(f.value):typeof f.value==="boolean"?(f.value?"Yes":"No"):String(f.value)).join(" / "):"Not confirmed";}
function evidence(id){return Review.evaluate(state,id).map(c=>`<div class="factrow"><div><strong>${esc(c.name)}</strong><small>Brief: ${esc(c.want)}</small><small>Found: ${esc(factValue(c))}</small></div>${badge(c.status)}</div>`).join('');}
function ask(id){const issue=Review.evaluate(state,id).find(c=>c.status!=='Match');return issue?`<div class="evidence-ask"><strong>${issue.status==='Mismatch'?'This misses a must-have':issue.status==='Conflict'?'The sources disagree':'One question to resolve'}</strong><p>${esc(issue.name)} · ${issue.status==='Mismatch'?'Record the mismatch before you decide.':issue.status==='Conflict'?'Keep both claims visible and arrange a check.':'No supporting evidence yet. Confirm before relying on it.'}</p></div>`:`<div class="evidence-ask" style="border-color:var(--accent);background:var(--wash)"><strong>All brief criteria have example evidence.</strong><p>The agent still makes the recommendation.</p></div>`;}
function outcomes(id){return `<div class="outcomes"><button class="primary" data-decide="Shortlisted" data-id="${id}">Shortlist</button><button data-decide="On hold" data-id="${id}">Hold</button><button data-decide="Passed" data-id="${id}">Pass</button><button class="quiet" data-decide="Missed" data-id="${id}">Missed</button></div>`;}
function assessmentExtras(id){const record=state.records.find(x=>x.engagementId===e().id&&x.propertyId===id);return `<div class="row between spacer"><span class="${record.assessment==='Assessed'?'reviewed':'muted'}">${esc(record.assessment)} · ${esc(record.decision)}</span><button class="link" data-decide="assess" data-id="${id}">Mark assessed</button></div><div class="tagline">${record.tags.map(t=>`<span class="chip">${esc(t)}<button data-remove-tag="${esc(t)}" aria-label="Remove ${esc(t)}">×</button></span>`).join('')}</div><div class="tags-input"><input placeholder="Tag this property for this engagement" aria-label="Engagement property tag" maxlength="48"><button data-action="tag">Add tag</button></div><details class="source-detail"><summary>Decision history · ${record.history.length}</summary><ul class="timeline">${record.history.map(h=>`<li><strong>${esc(h.action)}</strong><p>${esc(h.note)}${h.nextAction?'<br>Next: '+esc(h.nextAction):''}</p></li>`).join('')}</ul></details>`;}
function captureA(){return `<div class="intro"><div class="eyebrow">Step 1 / Capture the conversation</div><h1>Start with what<br>the buyer actually said.</h1><p>Turn a consultation transcript into a draft brief, check the important details, then start reviewing properties.</p></div><div class="a-intake"><section class="panel stack">${upload()}${transcriptEditor()}</section><aside style="padding:15px 0"><h3>A clear path to a useful shortlist</h3><ol class="step-list"><li><span class="number">1</span><div><strong>Bring in the conversation</strong><p>Upload or paste your buyer consultation.</p></div></li><li><span class="number">2</span><div><strong>Check the suggested brief</strong><p>See a source quote beside every suggested detail. Confirm or correct it.</p></div></li><li><span class="number">3</span><div><strong>Assess with context</strong><p>Review candidates against that brief. Keep reasons, passes and missed properties with this engagement.</p></div></li></ol><button class="link" data-action="sample">Try the full journey with an example →</button></aside></div>`;}
function reviewA(){return `<div class="intro"><div class="eyebrow">Step 2 / Confirm the brief</div><h1>Did we hear the buyer correctly?</h1><p>Keep the original words in view. Edit each suggestion and confirm it before applying it to the engagement.</p></div><div class="a-review spacer"><section class="panel"><div class="eyebrow">Original conversation</div><div class="transcript-text">${esc(draft().text||'Add a conversation to begin.')}</div><button class="link spacer" data-step="capture">Change transcript</button></section><section class="panel"><div class="eyebrow">Suggested client & engagement details</div>${fields()}</section></div>`;}
function propertiesA(){const p=property(state.selectedPropertyId),index=records().findIndex(x=>x.propertyId===p.id);return `<div class="row between"><div><div class="eyebrow">Step 3 / Assess candidates</div><h1>Is this worth pursuing?</h1><p class="muted">Property ${index+1} of ${records().length} · ${esc(client().name)} · ${esc(e().name.split(' · ')[0])}</p></div><button data-step="shortlist">View shortlist →</button></div><div class="panel"><div class="a-hero"><div>${illustration(p.id)}<div class="row between spacer"><div><div class="eyebrow">Fictional ${esc(p.name)}</div><h2>${esc(p.area)}</h2><p class="muted">${esc(description[p.id])}</p></div><span class="property-price">${money(p.facts.price[0].value)}</span></div><div class="row">${briefChips()}</div></div><section><div class="eyebrow">Against the buyer’s must-haves</div>${evidence(p.id)}${ask(p.id)}${outcomes(p.id)}${assessmentExtras(p.id)}${sources(p.id)}</section></div><div class="a-review-footer"><small>Your decision stays with this engagement.</small><button class="primary" data-action="next">Next property →</button></div></div><div class="mini-candidates">${records().map(x=>`<button data-select="${x.propertyId}" class="${x.propertyId===p.id?'selected':''}"><strong>${esc(property(x.propertyId).name)} · ${esc(property(x.propertyId).area)}</strong><small>${esc(x.decision)}</small></button>`).join('')}</div>`;}
function shortlist(){const list=records().filter(x=>x.decision==='Shortlisted');return `<div class="row between"><div><div class="eyebrow">Step 4 / Review the shortlist</div><h1>The options worth a conversation.</h1><p class="muted">${list.length} shortlisted · ${esc(client().name)} · ${esc(e().name.split(' · ')[0])}</p></div><button data-step="properties">Keep assessing →</button></div><div class="shortlist-note">A shortlist is an agent recommendation. Unresolved checks remain visible; this does not mark due diligence complete.</div><div class="final-list">${list.length?list.map(x=>`<article class="panel final-property">${illustration(x.propertyId)}<div><h3>${esc(property(x.propertyId).area)} · ${esc(property(x.propertyId).name)}</h3>${fitSummary(x.propertyId)}<p style="margin:10px 0 0">${esc(x.reason)}</p>${x.nextAction?'<small>Next: '+esc(x.nextAction)+'</small>':''}</div><button data-open="${x.propertyId}">Review details</button></article>`).join(''):`<div class="panel empty"><h2>No shortlist yet.</h2><p>Assess a candidate and record why you want to take it forward.</p><button class="primary" data-step="properties">Assess the first property →</button></div>`}</div>`;}
function clientHistory(){return `<div class="eyebrow">Client history</div><h1>Every property has a story.</h1><p class="muted">${esc(client().name)} · includes passes and missed properties across this client’s engagements.</p>${state.engagements.filter(x=>x.clientId===e().clientId).map(eng=>`<section class="panel spacer"><h2>${esc(eng.name)}</h2>${state.records.filter(x=>x.engagementId===eng.id).map(x=>`<div class="history-row"><div class="row between"><strong>${esc(property(x.propertyId).name)} · ${esc(property(x.propertyId).area)}</strong><span class="pill">${esc(x.decision)}</span></div><p>${esc(x.reason||'Not reviewed yet.')}${x.nextAction?'<br>Next: '+esc(x.nextAction):''}</p><small>${esc(x.assessment)} · ${x.history.length} history entries</small><div class="tagline">${x.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div><button class="link" data-history-eng="${eng.id}" data-id="${x.propertyId}">Open assessment →</button></div>`).join('')}</section>`).join('')}`;}
function VariantA(){return `<div class="a-shell"><aside class="a-rail"><div class="logo"><span class="logo-symbol"></span>buyers desk</div><div class="rail-clients"><div class="rail-label">Your engagements</div>${state.engagements.map(x=>`<button data-context-id="${x.id}" class="${x.id===e().id?'selected':''}">${esc(state.clients.find(c=>c.id===x.clientId).name)}<small>${esc(x.name.split(' · ')[0])}</small></button>`).join('')}</div><div class="rail-nav"><div class="rail-label">This client</div><button data-step="history">Property history →</button></div><div class="rail-bottom">Independent workflow exploration<br>Illustrative people & properties</div></aside><main class="a-content"><div class="a-top"><div><small>CLIENT WORKSPACE</small><h3 style="margin:4px 0">${esc(client().name)}</h3></div>${contextSelect()}</div><div class="a-stage">${journey()}${ui.step==='capture'?captureA():ui.step==='review'?reviewA():ui.step==='properties'?propertiesA():ui.step==='shortlist'?shortlist():clientHistory()}</div></main></div>`;}
function board(){const groups=[['To assess',x=>x.decision==='Undecided'],['On hold',x=>x.decision==='On hold'],['Shortlisted',x=>x.decision==='Shortlisted'],['Passed',x=>x.decision==='Passed'],['Missed',x=>x.decision==='Missed']];return `<div class="b-banner"><div><strong>Next: review the buyer’s candidates</strong><p>${records().filter(x=>x.decision==='Undecided').length} awaiting a decision. Open a property to check its evidence and record an outcome.</p></div><button class="primary" data-action="review-next">Review next property →</button></div>${briefChips()}<div class="board-scroll"><div class="board">${groups.map(([name,filter])=>{const list=records().filter(filter);return `<section class="board-column"><div class="board-title">${name}<span>${list.length}</span></div>${list.length?list.map(x=>`<button class="board-card" data-open="${x.propertyId}">${illustration(x.propertyId)}<h3>${esc(property(x.propertyId).area)}</h3><p class="muted">${esc(property(x.propertyId).name)}</p><div class="property-price">${money(property(x.propertyId).facts.price[0].value)}</div><div style="margin-top:12px">${fitSummary(x.propertyId)}</div>${x.reason?'<p class="muted" style="margin:10px 0 0">'+esc(x.reason)+'</p>':''}</button>`).join(''):'<div class="board-empty">No properties here yet</div>'}</section>`;}).join('')}</div></div>`;}
function VariantB(){const intake=ui.step==='capture'||ui.step==='review';return `<div class="b-shell"><header class="b-top"><div class="logo"><span class="logo-symbol"></span>buyers desk</div>${contextSelect()}</header><main class="b-workspace"><div class="b-heading"><div><div class="eyebrow">Engagement workspace</div><h1>${esc(client().name)} <span style="font-weight:400;color:#7e8b9c">/ ${esc(e().name.split(' · ')[0])}</span></h1><span class="muted">Conversation, brief and property outcomes in one working view.</span></div><span class="pill ${draft().approved?'':'warn'}">${draft().approved?'Brief reviewed':'Brief needs review'}</span></div>${tabs()}${intake?`<div class="b-inbox"><section><div class="eyebrow">Conversation inbox</div><h3>Start with a consultation</h3><small>One conversation can update the client and this engagement’s brief.</small><button class="conversation-button" data-action="sample"><strong>Example discovery call</strong><small style="display:block;margin-top:7px">Hart household · fictional sample</small><span style="display:block;margin-top:12px;font-size:12px">Open & extract →</span></button></section><section><div class="row between"><h3>Original conversation</h3><button class="link" data-action="upload">Upload text</button></div>${transcriptEditor()}</section><section><div class="eyebrow">Suggested details</div><h2>Check, then apply.</h2>${fields(true)}</section></div>`:ui.step==='properties'?board():ui.step==='shortlist'?shortlist():clientHistory()}</main></div>`;}
function comparison(){return `<div class="row between"><div><div class="eyebrow">Compare against the brief</div><h2>Make the trade-offs visible.</h2><p class="muted">Read across a requirement. Read down a candidate. Open evidence before deciding.</p></div><button class="primary" data-step="shortlist">View shortlist · ${records().filter(x=>x.decision==='Shortlisted').length} →</button></div><div class="comparison-scroll"><table class="comparison"><thead><tr><th><div class="eyebrow">The buyer’s brief</div><h3>${esc(client().name)}</h3><small>Each decision belongs to this engagement.</small></th>${records().map(x=>`<th>${illustration(x.propertyId)}<div class="eyebrow">${esc(property(x.propertyId).name)}</div><h3>${esc(property(x.propertyId).area)}</h3><span class="property-price">${money(property(x.propertyId).facts.price[0].value)}</span></th>`).join('')}</tr></thead><tbody>${Review.evaluate(state,records()[0].propertyId).map((criterion,i)=>`<tr><td><strong>${esc(criterion.name)}</strong><p style="font-size:12px;color:var(--muted);margin:6px 0">${esc(criterion.want)}</p></td>${records().map(x=>`<td>${badge(Review.evaluate(state,x.propertyId)[i].status)}<small style="display:block;margin-top:9px">${esc(factValue(Review.evaluate(state,x.propertyId)[i]))}</small></td>`).join('')}</tr>`).join('')}<tr><td><strong>Next decision</strong></td>${records().map(x=>`<td><span class="chip">${esc(x.assessment)} · ${esc(x.decision)}</span>${outcomes(x.propertyId)}<button class="link spacer" data-open="${x.propertyId}">Evidence & history ↗</button></td>`).join('')}</tr></tbody></table></div>`;}
function VariantC(){const intake=ui.step==='capture'||ui.step==='review';return `<div class="c-shell"><header class="c-top"><div class="logo"><span class="logo-symbol"></span>buyers desk</div>${contextSelect()}</header><main class="c-content"><div class="crumb">Clients / ${esc(client().name)} / ${esc(e().name.split(' · ')[0])}</div><div class="c-heading"><div><div class="eyebrow">A living engagement dossier</div><h1>${esc(client().name)}</h1><p class="muted">${esc(e().name)} · Brisbane</p></div><span class="pill">${draft().approved?'Brief confirmed':'Start with a conversation'}</span></div>${tabs()}${intake?`<div class="c-dossier"><section><div class="row between"><h2>The conversation becomes the brief.</h2><button class="link" data-action="sample">Try an example →</button></div><p class="muted">Capture the buyer’s words once. Keep the context close to every decision that follows.</p><article class="c-event"><div class="event-date">01<br>CAPTURE</div><div class="panel stack">${upload()}${transcriptEditor()}</div></article><article class="c-event"><div class="event-date">02<br>NEXT</div><div class="panel"><h3>Review candidates with the brief in view</h3><p class="muted" style="font-size:13px">Once you confirm the details, compare properties side by side. Decisions and follow-ups stay in the engagement history.</p><button class="link" data-step="properties">Preview the comparison desk →</button></div></article></section><aside class="panel profile"><div class="row"><div class="avatar">${esc(client().name.slice(0,2).toUpperCase())}</div><div><small>CLIENT & ENGAGEMENT</small><h3 style="margin:3px 0">${esc(e().name.split(' · ')[0])}</h3></div></div><div class="rule"></div><h2>Buyer brief</h2>${fields()}</aside></div>`:ui.step==='properties'?`${briefChips()}<div class="spacer">${comparison()}</div>`:ui.step==='shortlist'?shortlist():clientHistory()}</main></div>`;}
function switcher(){const approved=draft().approved?'Brief applied':draft().fields?'Suggestions to review':'No transcript yet';return `<aside class="switcher" aria-label="Prototype variant switcher"><button data-cycle="-1" aria-label="Previous variant">←</button><div><div class="prototype-label">UI EXPLORATION · EXAMPLE DATA</div><strong class="variant-name">${variant} / ${variants[variant]}</strong></div><button data-cycle="1" aria-label="Next variant">→</button><span class="separator"></span><div class="abc">${Object.keys(variants).map(v=>`<button data-variant="${v}" aria-pressed="${variant===v}">${v}</button>`).join('')}</div><span class="separator"></span><span class="state-note">${approved}<br>${records().filter(x=>x.decision==='Shortlisted').length} shortlisted · ${records().filter(x=>x.decision==='Missed').length} missed</span><button class="about" data-action="about">About / reset</button></aside>`;}
function dialogs(){const p=property(state.selectedPropertyId);return `<dialog id="inspector" class="inspector"><div class="row between"><small>${esc(client().name)} / ${esc(e().name.split(' · ')[0])}</small><button data-action="close-drawer" aria-label="Close property details">×</button></div>${illustration(p.id)}<div class="eyebrow">Fictional ${esc(p.name)}</div><div class="row between"><h2>${esc(p.area)}</h2><span class="property-price">${money(p.facts.price[0].value)}</span></div>${evidence(p.id)}${ask(p.id)}${outcomes(p.id)}${assessmentExtras(p.id)}${sources(p.id)}</dialog><dialog id="decision" class="modal"><button class="close" data-action="close-decision" aria-label="Close decision">×</button><div class="eyebrow">Keep the reason with the engagement</div><h2>${ui.decision==='assess'?'Record assessment':esc(ui.decision||'Record decision')}</h2><p class="muted">${esc(p.name)} · ${esc(p.area)} / ${esc(client().name)}</p>${ui.decision==='Missed'?'<div class="hint" style="margin-bottom:18px">Missed means unavailable or lost out. A deliberate choice not to pursue is a pass.</div>':''}<label for="decision-reason">${ui.decision==='assess'?'Assessment note':'Why this decision?'}</label><textarea id="decision-reason" placeholder="Explain the recommendation or outcome.">${esc(r()?.reason||'')}</textarea><label for="decision-next" style="margin-top:16px">Next action</label><input id="decision-next" placeholder="Who should do what next?" value="${esc(r()?.nextAction||'')}"><p class="draft-foot">A hold or unresolved shortlist needs an explicit follow-up.</p><div id="decision-error" class="error" role="alert"></div><div class="modal-footer"><button data-action="close-decision">Cancel</button><button class="primary" data-action="save-decision">Save ${ui.decision==='assess'?'assessment':'decision'} →</button></div></dialog><dialog id="about" class="modal"><button class="close" data-action="close-about" aria-label="Close prototype information">×</button><div class="eyebrow">Throwaway UI prototype</div><h2>Three ways through the same job.</h2><p>A: guided review. B: conversation inbox and property board. C: client dossier and comparison desk.</p><p class="muted">Transcript extraction is a local rule-based simulation, not ML. Every suggestion needs human review. No cloud service, storage or CRM is connected. All fixture people and properties are fictional. Reload resets everything; variant selection stays in the URL.</p><p class="muted">Buywell is a prospective reference agency and has not participated. HighLevel is unconfirmed.</p><p><small>Use ← / → to switch variants outside text fields. The demo and switcher are confined to this prototype file, outside the production application.</small></p><div class="modal-footer"><button data-action="reset">Reset all example data</button><button class="primary" data-action="close-about">Continue exploring</button></div></dialog>`;}
function render(){document.documentElement.dataset.variant=variant;$('app').innerHTML=({A:VariantA,B:VariantB,C:VariantC}[variant])()+switcher()+dialogs()+attachmentDialog();if(ui.drawer)$('inspector').showModal();if(ui.decision)$('decision').showModal();wireDrop();}
let toastTimer;
function notify(text){$('notice').textContent=text;$('notice').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('notice').hidden=true,4500);}
function setVariant(v){variant=v;const url=new URL(location.href);url.searchParams.set('variant',v);window.history.replaceState(null,'',url);ui.drawer=false;ui.decision=null;render();}
function cycle(delta){const keys=Object.keys(variants);setVariant(keys[(keys.indexOf(variant)+delta+3)%3]);}
function selectContext(id){state=Review.transition(state,{type:'context',id});ui.drawer=false;ui.decision=null;render();}
function parseTranscript(text){const buyerLines=text.split('\n').filter(line=>/^\s*(?:buyer|client|sam|alex)\s*:/i.test(line));const relevant=buyerLines.length?buyerLines:[];const find=regex=>relevant.find(line=>regex.test(line))||'';const nameLine=find(/\bwe(?:'|’)?re\s+.+\./i),nameMatch=nameLine.match(/\bwe(?:'|’)?re\s+([^.!?]+)[.!?]/i);const budgetLines=relevant.filter(line=>/budget/i.test(line));const amounts=[];budgetLines.forEach(line=>{for(const m of line.matchAll(/\$([\d,]+(?:\.\d+)?)\s*(million|thousand|m\b|k\b)?/gi)){const raw=Number(m[1].replace(/,/g,'')),unit=(m[2]||'').toLowerCase();amounts.push(raw*(unit==='m'||unit==='million'?1000000:unit==='k'||unit==='thousand'?1000:1));}});const bedLine=find(/\b\d+\s*bedrooms?\b/i),bed=bedLine.match(/\b(\d+)\s*bedrooms?\b/i);const areaLines=relevant.filter(line=>/Indooroopilly|Taringa|Mitchelton/i.test(line));const areas=['Indooroopilly','Taringa','Mitchelton'].filter(area=>areaLines.some(line=>line.toLowerCase().includes(area.toLowerCase())));const accessLine=find(/step[ -]free/i),accessUnclear=/not|no need|don't|don’t/i.test(accessLine);return [{key:'name',label:'Client / household',value:nameMatch?nameMatch[1]:'',quote:nameLine,placeholder:'Name to confirm',accepted:false},{key:'budget',label:'Engagement budget (AUD)',value:amounts.length?String(amounts[0]):'',quote:budgetLines.join('\n'),conflict:new Set(amounts).size>1,placeholder:'e.g. 1200000',accepted:false},{key:'beds',label:'Minimum bedrooms',value:bed?bed[1]:'',quote:bedLine,placeholder:'e.g. 3',accepted:false},{key:'areas',label:'Search suburbs',value:areas.join(', '),quote:areaLines.join('\n'),placeholder:'Comma-separated suburbs',accepted:false},{key:'stepFree',label:'Step-free access required? (yes / no)',value:accessLine&&!accessUnclear?'yes':'',quote:accessLine,conflict:accessUnclear,placeholder:'Confirm yes or no',accepted:false}];}
function extract(){const text=$('transcript')?$('transcript').value:draft().text;if(!text.trim()){notify('Paste a conversation or try the fictional example first.');return;}draft().text=text;draft().fields=parseTranscript(text);draft().stale=false;draft().approved=false;ui.step='review';render();notify('Suggestions ready. Check the source quotes and accept each field.');}
function apply(){const d=draft();if(d.stale){notify("The transcript changed. Extract fresh suggestions before applying.");return;}if(!d.fields||d.fields.some(f=>!f.accepted)){notify('Review and confirm every field before applying the brief.');return;}const values=Object.fromEntries(d.fields.map(f=>[f.key,f.value.trim()]));const budget=Number(values.budget.replace(/[$,]/g,'')),beds=Number(values.beds);if(!values.name||!Number.isFinite(budget)||budget<=0||!Number.isInteger(beds)||beds<1||!values.areas||!['yes','no'].includes(values.stepFree.toLowerCase())){notify('Check the name, numeric budget/bedrooms, suburbs and yes/no access requirement.');return;}const next=structuredClone(state),eng=next.engagements.find(x=>x.id===e().id);next.clients.find(x=>x.id===eng.clientId).name=values.name;eng.budget=budget;eng.beds=beds;eng.areas=values.areas.split(',').map(s=>s.trim()).filter(Boolean);eng.stepFree=values.stepFree.toLowerCase()==='yes';next.ingestions={...(next.ingestions||{}),[eng.id]:{transcript:d.text,fields:structuredClone(d.fields)}};state=next;d.approved=true;ui.step='properties';render();notify('Reviewed brief applied. Now assess the properties against it.');}
function choose(id,drawer=false){state=Review.transition(state,{type:'select',id});ui.drawer=drawer;render();}
function saveDecision(){const action={type:ui.decision==='assess'?'assess':'decide',value:ui.decision,reason:$('decision-reason').value,nextAction:$('decision-next').value};const next=Review.transition(state,action);if(next.error){$('decision-error').textContent=next.message;return;}state=next;ui.decision=null;ui.drawer=false;render();notify(state.message);}
function acceptFile(file){if(!file)return;if(!/\.(txt|md|vtt|srt)$/i.test(file.name)||file.size>500000){notify('Use a text transcript (.txt, .md, .vtt, .srt) under 500 KB.');return;}const engagementId=e().id;file.text().then(text=>{const d=ui.drafts[engagementId]||(ui.drafts[engagementId]={});Object.assign(d,{text,filename:file.name,fields:null,approved:false});if(e().id===engagementId){ui.step='capture';render();notify('Transcript loaded. Extract suggestions when ready.');}});}
function wireDrop(){document.querySelectorAll('[data-drop]').forEach(zone=>{zone.addEventListener('dragover',event=>{event.preventDefault();zone.classList.add('drag');});zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));zone.addEventListener('drop',event=>{event.preventDefault();acceptFile(event.dataTransfer.files[0]);});});}
document.addEventListener('input',event=>{if(event.target.id==='transcript'){draft().text=event.target.value;draft().stale=true;draft().approved=false;}if(event.target.dataset.field!==undefined){const f=draft().fields[Number(event.target.dataset.field)];f.value=event.target.value;f.accepted=false;draft().approved=false;const checkbox=document.querySelector(`[data-accept="${event.target.dataset.field}"]`);if(checkbox)checkbox.checked=false;}});
document.addEventListener('change',event=>{if(event.target.matches('[data-context]'))selectContext(event.target.value);if(event.target.dataset.accept!==undefined)draft().fields[Number(event.target.dataset.accept)].accepted=event.target.checked;});
$('file').addEventListener('change',event=>{acceptFile(event.target.files[0]);event.target.value='';});
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;
if(b.dataset.variant)setVariant(b.dataset.variant);if(b.dataset.cycle)cycle(Number(b.dataset.cycle));if(b.dataset.contextId)selectContext(b.dataset.contextId);
if(b.dataset.step){ui.step=b.dataset.step;ui.drawer=false;ui.decision=null;render();}
if(b.dataset.select)choose(b.dataset.select);if(b.dataset.open)choose(b.dataset.open,true);
if(b.dataset.historyEng){state=Review.transition(state,{type:'context',id:b.dataset.historyEng});choose(b.dataset.id,true);}
if(b.dataset.decide){state=Review.transition(state,{type:'select',id:b.dataset.id});ui.decision=b.dataset.decide;render();$('decision-reason').focus();}
if(b.dataset.removeTag){state=Review.transition(state,{type:'removeTag',value:b.dataset.removeTag});render();}
const action=b.dataset.action;
if(action==='sample'){Object.assign(draft(),{text:sample,filename:'Fictional consultation.txt',fields:parseTranscript(sample),stale:false,approved:false});ui.step='review';render();}
if(action==='attach-candidate')$('attach-dialog').showModal();if(action==='close-attach')$('attach-dialog').close();if(action==='save-attachment'){state=Review.transition(state,{type:'attach',id:$('candidate-to-attach').value});render();notify(state.message);}
if(action==='upload')$('file').click();if(action==='extract')extract();if(action==='apply')apply();
if(action==='next'){const list=records(),index=list.findIndex(x=>x.propertyId===state.selectedPropertyId);choose(list[(index+1)%list.length].propertyId);}
if(action==='review-next'){const next=records().find(x=>x.decision==='Undecided')||records()[0];choose(next.propertyId,true);}
if(action==='save-decision')saveDecision();if(action==='close-decision'){ui.decision=null;render();}if(action==='close-drawer'){ui.drawer=false;render();}
if(action==='tag'){const input=b.parentElement.querySelector('input');state=Review.transition(state,{type:'tag',value:input.value});render();notify(state.message);}
if(action==='about')$('about').showModal();if(action==='close-about')$('about').close();
if(action==='reset'){state=Review.initial();ui.step='capture';ui.drawer=false;ui.decision=null;ui.drafts={};render();notify('All example data reset.');}
});
document.addEventListener('keydown',event=>{if(document.querySelector('dialog[open]')||event.target.closest('input,textarea,select,[contenteditable="true"]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();cycle(event.key==='ArrowRight'?1:-1);}});
document.addEventListener('cancel',event=>{if(event.target.id==='decision')ui.decision=null;if(event.target.id==='inspector')ui.drawer=false;},true);
render();
</script></html>
