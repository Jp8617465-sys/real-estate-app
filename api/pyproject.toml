[project]
name = "buyers-desk-api"
version = "0.1.0"
description = "Buyers-agent workspace back end: one modular Python application serving the documented product API (ADR 0001)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = []
files = ["buyers_desk", "tests"]
