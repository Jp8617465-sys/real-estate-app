13
00:01:05.688 --> 00:01:10.571
Nadia Pearce | Halyard Buyers Advocacy: Wow. Okay. Respect. And Rhys, you're a sparky, is that right? From the form?

00:01:10.920 --> 00:01:14.915

15
00:01:15.211 --> 00:01:22.965

00:01:22.965 --> 00:01:31.087

17
00:01:31.087 --> 00:01:37.363

18
00:01:37.363 --> 00:01:40.686

19
00:01:41.459 --> 00:01:46.356

20
00:01:46.356 --> 00:01:51.952
Tash Kumar: And we've been saving for ages, and we sort of, we just want to stop renting.

21

Tash Kumar: Our rent's gone up like a hundred and twenty dollars a week in the last two years.

22
00:01:58.579 --> 00:01:59.825
Rhys Gallagher: Hundred and thirty.

23
00:02:00.460 --> 00:02:04.833
Tash Kumar: Hundred and thirty. And it's, like, we're paying someone else's mortgage, you know.

24
00:02:07.594 --> 00:02:12.009
Nadia Pearce | Halyard Buyers Advocacy: Yeah. I hear that every week. So this is your first place?

25
00:02:12.970 --> 00:02:14.402
Tash Kumar: First place, yeah.

26
00:02:16.273 --> 00:02:17.682
Rhys Gallagher: First home buyers.

27
00:02:18.302 --> 00:02:21.274
Nadia Pearce | Halyard Buyers Advocacy: Okay. Great. And have you been looking much?

28
00:02:22.225 --> 00:02:26.391
Tash Kumar: A bit. Mostly online. We've been to, like, five or six opens.

29
00:02:26.391 --> 00:02:31.946
Tash Kumar: We went to a townhouse in Kedron that we really liked but it went really quickly.

30
00:02:31.946 --> 00:02:36.113
Tash Kumar: Like, before we even had a chance to get our act together.

31
00:02:36.680 --> 00:02:39.357
Rhys Gallagher: It was gone in like four days.

32
00:02:39.755 --> 00:02:46.564
Nadia Pearce | Halyard Buyers Advocacy: Yeah, that happens a lot with townhouses at the moment, especially the ones in the first home buyer price range.

33
00:02:46.564 --> 00:02:50.990
Nadia Pearce | Halyard Buyers Advocacy: Everyone's chasing the same stuff. Do you know roughly what it went for?

34
00:02:51.739 --> 00:02:57.756
Rhys Gallagher: The agent said offers over eight-fifty, and then someone said it went for, um, nine-twenty? Something like that.

35
00:02:58.353 --> 00:03:03.805
Nadia Pearce | Halyard Buyers Advocacy: Yep. That sounds about right. Okay, so tell me, what are you thinking? Townhouse, unit, house?

36
00:03:04.655 --> 00:03:11.582

37
00:03:12.332 --> 00:03:20.520
Rhys Gallagher: We had a look at houses out in, like, Bracken Ridge, Zilmere, but Tash doesn't want to be too far from work.

38
00:03:20.986 --> 00:03:28.538
Tash Kumar: Because of nights. Like, when I finish a night shift at eight in the morning, I don't want to drive forty minutes.

39
00:03:28.538 --> 00:03:31.971
Tash Kumar: I just want to get home and go to bed.

40
00:03:32.372 --> 00:03:41.159
Nadia Pearce | Halyard Buyers Advocacy: Yeah, completely. That's actually a really important one, I'll write that down. So, distance to Chermside is a big priority for you.

41
00:03:42.027 --> 00:03:43.955
Tash Kumar: Yeah. Like twenty minutes max.

42
00:03:44.210 --> 00:03:46.772
Nadia Pearce | Halyard Buyers Advocacy: Okay. And Rhys, where's your work?

43
00:03:47.673 --> 00:03:54.686
Rhys Gallagher: All over. Wherever the job is. Mostly the city, Fortitude Valley, sometimes out at the airport. I drive.

44
00:03:55.560 --> 00:03:59.388
Nadia Pearce | Halyard Buyers Advocacy: Okay, so you're flexible. And you've got a work vehicle?

45
00:03:59.932 --> 00:04:05.315
Rhys Gallagher: Yeah, I've got the ute, it's mine, not the company's. And I've got all my tools.

46
00:04:05.315 --> 00:04:12.717
Rhys Gallagher: So I need, like, a lockable garage. I can't leave tools in the ute on the street. I've had them nicked before.

47
00:04:13.741 --> 00:04:18.351
Nadia Pearce | Halyard Buyers Advocacy: Oh no. Yeah. Okay, that's a must. Secure garage, lock up. And what else?

48
00:04:18.606 --> 00:04:22.035
Tash Kumar: Three bedrooms would be good. Or two and a study.

49
00:04:22.035 --> 00:04:27.864
Tash Kumar: We've got a cat, so, um, pet friendly, which I know with a body corporate can be—

50
00:04:27.940 --> 00:04:35.666
Nadia Pearce | Halyard Buyers Advocacy: Yep. That's one of the things I'd check in the by-laws. It's mostly fine now in Queensland, but it's worth checking.

51

00:09:50.573 --> 00:09:57.106

00:09:59.408 --> 00:10:02.685

00:10:03.408 --> 00:10:10.970

00:10:10.970 --> 00:10:18.188

122
00:10:18.188 --> 00:10:25.062

123
00:10:25.062 --> 00:10:30.561

00:17:45.371 --> 00:17:50.031

00:17:50.031 --> 00:17:54.690

/* ======================================================================

const IntakeReview = (() => {
  // The agreed field list (Decide how consultation transcripts become reviewed records).
  // support: whose words can carry the field.

  const F = (label, item, section, group, kind, support, extra) => ({ label, item, section, group, kind, support, ...(extra || {}) });
  const FIELDS = {
    finalSay:        F('Who has the final say', 'Final say', 'profile', 'People', 'one', 'household'),
    housing:         F('Lives now', 'Lives now', 'profile', 'Circumstances', 'one', 'household'),
    work_tash:       F('Work · Tash', 'Work · Tash', 'profile', 'Circumstances', 'one', 'household'),
    work_rhys:       F('Work · Rhys', 'Work · Rhys', 'profile', 'Circumstances', 'one', 'household'),

    pets:            F('Pets', 'Pets', 'profile', 'Circumstances', 'one', 'household'),

    professionals:   F('Professionals', 'Professional', 'profile', 'Professionals', 'many', 'household-or-professional'),
    purpose:         F('Purpose', 'Purpose', 'brief', 'Purpose and money', 'one', 'household'),

    budgetCeiling:   F('Budget ceiling', 'Budget ceiling', 'brief', 'Purpose and money', 'one', 'household', { key: true }),
    brokerGuidance:  F("Broker's price guidance", "Broker's price guidance", 'brief', 'Purpose and money', 'one', 'household-or-professional'),
    preApproval:     F('Pre-approval (status, amount, lender, expiry)', 'Pre-approval', 'brief', 'Purpose and money', 'one', 'household-or-professional', { key: true }),
    deposit:         F('Deposit and funds', 'Deposit and funds', 'brief', 'Purpose and money', 'one', 'household'),
    depositScheme:   F('Deposit scheme', 'Deposit scheme', 'brief', 'Purpose and money', 'one', 'household-or-professional'),
    familyHelp:      F('Family help', 'Family help', 'brief', 'Purpose and money', 'one', 'household'),
    mustSellFirst:   F('Must sell first', 'Must sell first', 'brief', 'Purpose and money', 'one', 'household'),
    areas:           F('Areas', 'Area', 'brief', 'Where', 'many', 'household'),
    propertyType:    F('Property type', 'Property type', 'brief', 'What', 'one', 'household'),
    bedrooms:        F('Bedrooms', 'Bedrooms', 'brief', 'What', 'one', 'household'),
    bathrooms:       F('Bathrooms', 'Bathrooms', 'brief', 'What', 'one', 'household'),
    parking:         F('Parking', 'Parking', 'brief', 'What', 'one', 'household'),

    mustHaves:       F('Must-haves', 'Must-have', 'brief', 'Must-haves', 'many', 'household'),
    dealBreakers:    F('Deal-breakers', 'Deal-breaker', 'brief', 'Deal-breakers', 'many', 'household', { key: true }),
    niceToHaves:     F('Nice-to-haves', 'Nice-to-have', 'brief', 'Nice-to-haves', 'many', 'household'),
    newOrEstablished:F('New or established', 'New or established', 'brief', 'Condition and risk', 'one', 'household'),
    strata:          F('Strata acceptable', 'Strata acceptable', 'brief', 'Condition and risk', 'one', 'household'),
    renovation:      F('Renovation appetite', 'Renovation appetite', 'brief', 'Condition and risk', 'one', 'household'),
    floodTolerance:  F('Flood or overlay tolerance', 'Flood or overlay tolerance', 'brief', 'Condition and risk', 'one', 'household', { partly: { field: 'dealBreakers', test: /flood/i, text: 'overlay-only not discussed (flooding itself is a deal-breaker)' } }),
    timeline:        F('Timeline', 'Timeline', 'brief', 'Timing', 'one', 'household'),
    investor:        F('Investor-only: entity, yield or growth, tenanted', 'Investor-only', 'brief', 'Investor', 'one', 'household', { investorOnly: true }),
    notes:           F('Brief notes (not scored)', 'Brief note', 'brief', 'Notes', 'many', 'household'),
    referral:        F('Referral source', 'Referral source', 'intake', 'Engagement intake', 'one', 'household-or-professional'),
    service:         F('Service wanted', 'Service wanted', 'intake', 'Engagement intake', 'one', 'household'),
    properties:      F('Properties mentioned', 'Property mentioned', 'properties', 'Properties', 'many', 'household'),
    nextActions:     F('Next actions', 'Next action', 'actions', 'Next actions', 'many', 'owner', { key: true }),
  };
  const SECTIONS = [['profile', 'Buyer profile'], ['brief', 'Buyer brief'], ['intake', 'Engagement intake'], ['properties', 'Properties mentioned'], ['actions', 'Next actions']];

  // ---- Transcript ------------------------------------------------------
  function parseTranscript(text) {
    const cues = [];
    for (const block of text.replace(/\r/g, '').trim().split(/\n\s*\n/)) {
      const lines = block.split('\n');
      const t = lines.findIndex(l => l.includes('-->'));
      if (t < 0) continue;
      const body = lines.slice(t + 1).join('\n');
      const m = body.match(/^([^:\n]{1,60}): ([\s\S]*)$/);
      const time = lines[t].split(' --> ')[0].replace(/^00:/, '').replace(/\.\d+$/, '');
      cues.push({ n: cues.length, time, speaker: m ? m[1] : '?', text: m ? m[2] : body });
    }
    return cues;
  }

  // ---- Suggestion contract + quote check ---------------------------------
  // Every quote (supporting, earlier value, each side of a disagreement) must sit inside one cue
  // spoken by the claimed speaker. Failures are dropped before review and counted.
  function quoteSets(s) {
    const c = s.conflict || {};
    return [s.quotes || [], (c.earlier && c.earlier.quotes) || [], (c.views || []).map(v => v.quote)];
  }
  function problem(cues, s) {
    if (!FIELDS[s.field]) return `“${s.fieldLabel || s.field}” is not on the agreed field list`;
    if (s.basis !== 'stated' && s.basis !== 'inferred') return 'Not marked stated or inferred';
    if (!s.quotes || !s.quotes.length) return 'No supporting quote';
    for (const q of quoteSets(s).flat()) {
      const hits = cues.filter(c => c.text.includes(q.text));
      if (!hits.length) return `Quote not found word for word: “${q.text}”`;
      if (!hits.some(c => c.speaker === q.speaker)) return `Quote found, but “${hits[0].speaker}” said it, not “${q.speaker}”`;
    }
    return null;
  }
  function locate(cues, q) {
    const cue = cues.find(c => c.speaker === q.speaker && c.text.includes(q.text));
    return { ...q, cue: cue.n, time: cue.time };
  }
  function checkSuggestions(cues, raw) {
    const kept = [], dropped = [];
    for (const s of raw) {
      const reason = problem(cues, s);
      if (reason) { dropped.push({ ...s, reason }); continue; }
      const c = s.conflict;
      kept.push({
        ...s,
        quotes: s.quotes.map(q => locate(cues, q)),
        conflict: c && {
          ...c,
          earlier: c.earlier && { ...c.earlier, quotes: c.earlier.quotes.map(q => locate(cues, q)) },
          views: c.views && c.views.map(v => ({ ...v, quote: locate(cues, v.quote) })),

    return { kept, dropped };

  // ---- State -----------------------------------------------------------
  function initialState({ cues, suggestions, dropped, people, existing, guesses }) {
    const labels = [...new Set(cues.map(c => c.speaker))];
    const speakers = {};
    labels.forEach(l => { speakers[l] = guesses[l] ? { ...guesses[l], guessed: true } : null; });
    const record = {};
    for (const [f, e] of Object.entries(existing)) record[f] = { ...e, status: 'on record', history: [] };
    return {
      ctx: { cues, suggestions, dropped, labels },
      stage: 'speakers', people: [...people], speakers, decisions: {}, record, seq: 0, log: [],
      last: { ok: true, text: 'Match each speaker label to a person. Suggestions stay hidden until every speaker is matched.' },
    };
  }

  const kindOf = (st, label) => st.speakers[label] && st.speakers[label].kind;
  function nameOf(st, label) {
    const m = st.speakers[label];
    if (!m) return label;
    if (m.kind === 'agent') return `${m.name} (you)`;
    if (m.kind === 'other') return m.role ? `${m.name} (${m.role.toLowerCase()})` : m.name;
    return m.name;
  }
  const namesOf = (st, quotes) => [...new Set(quotes.map(q => nameOf(st, q.speaker)))].join(' and ');
  const matched = m => !!(m && m.kind && m.name && m.name.trim());

  // Why a suggestion needs an individual decision, and whether it may be applied at all.
  function assess(st, s) {
    const field = FIELDS[s.field];
    const kinds = s.quotes.map(q => kindOf(st, q.speaker));
    let blocked = null, blockedTag = null;
    if (field.support === 'owner') {
      if (!s.quotes.some(q => (s.owners || []).includes(q.speaker))) {
        blocked = `Nobody who owes this said they would do it. Only ${namesOf(st, s.quotes)} spoke.`;
        blockedTag = 'No commitment from who owes it';
      }
    } else {
      const ok = field.support === 'household' ? kinds.includes('household') : kinds.some(k => k === 'household' || k === 'other');
      if (!ok) {
        blockedTag = 'Not said by the buyers';
        blocked = kinds.includes('other')
          ? `Only ${namesOf(st, s.quotes)} said this. Someone else's figure stays their own fact; it becomes the buyers' only if a buyer accepts it.`
          : kinds.includes('agent')
            ? `Only you (the agent) said this. It counts once a buyer confirms it.`
            : 'No household member said this.';
      }
    }
    const reasons = [];
    if (blocked) reasons.push({ code: 'blocked', tone: 'bad', text: blockedTag });
    if (s.conflict && s.conflict.type === 'superseded') reasons.push({ code: 'changed', tone: 'warn', text: 'Changed during the call' });
    if (s.conflict && s.conflict.type === 'disagreement') reasons.push({ code: 'disagree', tone: 'warn', text: 'Decision makers disagree' });
    const current = field.kind === 'one' ? st.record[s.field] : null;
    if (current && current.sid !== s.id) reasons.push({ code: 'replaces', tone: 'warn', text: 'Would replace a value on record' });
    if (s.basis === 'inferred') reasons.push({ code: 'inferred', tone: 'warn', text: 'Inferred' });
    const decision = st.decisions[s.id] || null;
    return { s, blocked, reasons, current, decision, bucket: decision ? 'done' : reasons.length ? 'decide' : 'ready' };
  }
  const queue = st => st.ctx.suggestions.map(s => assess(st, s));

  // ---- Reducer -----------------------------------------------------------
  function done(st, text, patch) {
    const seq = st.seq + 1;
    return { ...st, ...patch, seq, log: [...st.log, { seq, text }], last: { ok: true, text } };
  }
  const refuse = (st, text) => ({ ...st, last: { ok: false, text } });

  function write(st, s, value, status, quotes) {
    const field = FIELDS[s.field];
    const entry = {
      sid: s.id, field: s.field, value, status, basis: s.basis, quotes,
      owners: s.owners, due: s.due, outcome: s.outcome, detail: s.detail,
      source: `Call 03 · ${namesOf(st, quotes)} · ${status === 'edited' ? 'edited' : status === 'discuss' ? 'kept to discuss' : 'accepted'} at review`,
    };
    const record = { ...st.record };
    if (field.kind === 'one') {
      const prev = record[s.field];
      entry.history = prev ? [...(prev.history || []), { value: prev.value, source: prev.source }] : [];
      record[s.field] = entry;
    } else {
      record[s.field] = [...(record[s.field] || []), entry];

  }

  function reduce(st, a) {
    const s = a.id && st.ctx.suggestions.find(x => x.id === a.id);
    const label = s && (FIELDS[s.field].item + ': ' + (s.value.length > 60 ? s.value.slice(0, 57) + '…' : s.value));
    const itemGuard = () => {
      if (st.stage !== 'review') return 'Suggestions can only be decided on the review step.';
      if (!s) return 'No such suggestion.';
      if (st.decisions[s.id]) return `Already decided (${st.decisions[s.id].status}). Undo to change it.`;
      return null;
    };
    switch (a.type) {
      case 'matchSpeaker': {
        if (st.stage !== 'speakers') return refuse(st, 'Speakers are locked while you review. Go back to speaker matching first.');
        const m = a.kind ? { kind: a.kind, name: a.name || '', role: a.role || '', isNew: !!a.isNew } : null;
        return done(st, m ? `Matched “${a.label}” to ${m.kind === 'agent' ? 'you' : m.name || 'a person still to be named'}${m.kind === 'other' ? ' (someone else)' : m.isNew ? ' (new household member)' : m.kind === 'household' ? ' (household member)' : ''}.` : `Cleared the match for “${a.label}”.`,
          { speakers: { ...st.speakers, [a.label]: m } });
      }

        if (st.stage !== 'speakers') return refuse(st, 'Speakers are already confirmed.');

        if (missing.length) return refuse(st, `Match every speaker first: ${missing.map(l => `“${l}”`).join(', ')} ${missing.length > 1 ? 'are' : 'is'} not matched to a person.`);

        const people = [...st.people];
        st.ctx.labels.forEach(l => { const m = st.speakers[l]; if (m.kind === 'household' && !people.includes(m.name)) people.push(m.name); });

        st.ctx.labels.forEach(l => { speakers[l] = { ...st.speakers[l], guessed: false }; });

        if (Object.keys(st.decisions).length) return refuse(st, 'Speakers are locked once a suggestion has been decided, because attribution has already been used. Undo those decisions or start over.');

          const v = (a.value || '').trim();
          if (!v) return refuse(st, 'An edited value cannot be empty. Reject it instead.');
          if (v !== s.value) return done(st, `Edited and applied “${FIELDS[s.field].item}”. The quote stays with it as the source.`, write(st, s, v, 'edited', s.quotes));
        }
        const status = isDiscuss ? 'discuss' : 'accepted';
        const extra = x.current ? ` It replaced “${x.current.value}”, which stays in the field's history.` : '';
        return done(st, `${isDiscuss ? 'Kept as “to discuss”' : 'Applied'} “${label}”.${extra}`, write(st, s, s.value, status, s.quotes));
      }
      case 'useEarlier': {
        const g = itemGuard(); if (g) return refuse(st, g);
        if (!s.conflict || s.conflict.type !== 'superseded') return refuse(st, 'Only a value that changed during the call has an earlier value.');
        const x = assess(st, s);
        if (x.blocked) return refuse(st, `Can't apply “${label}”. ${x.blocked}`);
        return done(st, `Applied the earlier value “${s.conflict.earlier.value}” for ${FIELDS[s.field].item}.`, write(st, s, s.conflict.earlier.value, 'earlier', s.conflict.earlier.quotes));
      }
      case 'reject': {
        const g = itemGuard(); if (g) return refuse(st, g);
        return done(st, `Rejected “${label}”. Nothing was written.`, { decisions: { ...st.decisions, [s.id]: { status: 'rejected', seq: st.seq + 1 } } });
      }
      case 'ask': {
        const g = itemGuard(); if (g) return refuse(st, g);
        return done(st, `Added “${label}” to Ask the client. Nothing was written to the record.`, { decisions: { ...st.decisions, [s.id]: { status: 'ask', seq: st.seq + 1 } } });
      }
      case 'acceptRest': {
        if (st.stage !== 'review') return refuse(st, 'Suggestions can only be decided on the review step.');
        const ready = queue(st).filter(x => x.bucket === 'ready');
        if (!ready.length) return refuse(st, 'Nothing left that is safe to accept together.');
        let next = st;
        for (const x of ready) next = { ...next, ...write(next, x.s, x.s.value, 'accepted', x.s.quotes) };
        const left = queue(next).filter(x => x.bucket === 'decide').length;
        return done(next, `Accepted ${ready.length} stated, unconflicted suggestions together.${left ? ` ${left} still need your decision; they were not touched.` : ''}`);
      }
      case 'finish': {
        if (st.stage !== 'review') return refuse(st, 'Finish from the review step.');
        const open = queue(st).filter(x => x.bucket !== 'done').length;
        return done(st, `Review finished.${open ? ` ${open} suggestion${open > 1 ? 's were' : ' was'} left undecided, so nothing was written for ${open > 1 ? 'them' : 'it'}.` : ''}`, { stage: 'result' });
      }
      case 'back': {
        if (st.stage !== 'result') return refuse(st, 'Nothing to go back to.');
        return done(st, 'Back to reviewing suggestions.', { stage: 'review' });
      }
      default: return refuse(st, `Unknown action ${a.type}`);
    }
  }

  // ---- What the reviewed record now says ----------------------------------
  function summary(st) {
    const entries = {}; SECTIONS.forEach(([k]) => { entries[k] = []; });
    const toDiscuss = [], notCovered = [];
    const purpose = st.record.purpose;
    for (const [id, f] of Object.entries(FIELDS)) {
      const v = st.record[id];
      const list = !v ? [] : Array.isArray(v) ? v : [v];
      list.forEach(e => { (e.status === 'discuss' ? toDiscuss : entries[f.section]).push({ id, f, e }); });
      const settled = list.some(e => e.status !== 'discuss');
      if (!settled && !['properties', 'nextActions', 'notes', 'professionals'].includes(id)) {
        const partly = f.partly && (st.record[f.partly.field] || []).some(e => f.partly.test.test(e.value));
        if (f.investorOnly && purpose && !/invest/i.test(purpose.value)) notCovered.push(`${f.label}: not applicable (buying a home to live in)`);
        else if (partly) notCovered.push(`${f.label}: ${f.partly.text}`);
        else notCovered.push(list.length ? `${f.label}: undecided (to discuss)` : f.label);
      }
    }
    const q = queue(st);
    return {
      entries, toDiscuss, notCovered,
      ask: q.filter(x => x.decision && x.decision.status === 'ask').map(x => x.s),
      rejected: q.filter(x => x.decision && x.decision.status === 'rejected').map(x => x.s),
      undecided: q.filter(x => !x.decision).map(x => x.s),
      written: q.filter(x => x.decision && ['accepted', 'edited', 'earlier', 'discuss'].includes(x.decision.status)).length,
      dropped: st.ctx.dropped,
      people: st.people,
    };
  }

  return { FIELDS, SECTIONS, parseTranscript, checkSuggestions, initialState, reduce, assess, queue, summary, nameOf };
})();

    if (!d) v = k.expect === 'keepOut' || k.expect === 'ask' ? 'ok' : 'unreviewed';

    else v = written ? 'ok' : 'missed';
    return { s, f, k, d, v, key: !!f.key && !k.trap, rowValue: decision && decision.value };
  });
  const keyRows = rows.filter(r => r.key), other = rows.filter(r => !r.key && !r.k.trap);
  return {
    rows, slipped: rows.filter(r => r.v === 'slipped' || r.v === 'wrong'),

  { name: 'Speed run', about: 'Trust the page: accept every decision item it allows, then accept the rest in one click. The code-level rules still hold back the broker’s ceiling, the agent-only suburbs and the car loan. Watch what the single accept carries in with it.',
    steps: [
      ['Match the four speakers', () => MATCH('other')],
      ['Accept every decision item the page allows, as suggested', st => IntakeReview.queue(st).filter(x => x.bucket === 'decide' && !x.blocked).map(x => ({ type: 'accept', id: x.s.id }))],
      ['Try the flagged ones too', st => IntakeReview.queue(st).filter(x => x.bucket === 'decide' && x.blocked).map(x => ({ type: 'accept', id: x.s.id }))],
      ['Accept the rest together', () => [{ type: 'acceptRest' }]],
      ['Finish and compare with the answer key', () => [{ type: 'finish' }]],

  { name: 'Broker matched as family', about: 'A plausible slip in step 1: iPhone (2) is matched as a new household member. Every rule downstream trusts that match, so Dan’s $950k stops being “someone else’s figure” and moves into the ready list as a buyer requirement.',
    steps: [
      ['Match iPhone (2) as a new household member called Dan', () => MATCH('household')],
      ['Look for Dan’s $950k ceiling: it is in Ready to accept now', () => []],
      ['Accept the rest together', () => [{ type: 'acceptRest' }]],

    steps: [
      ['Try to see suggestions before iPhone (2) is matched', () => [{ type: 'confirmSpeakers' }]],
      ['Match iPhone (2) properly and continue', () => MATCH('other')],
      ['Try to apply Dan’s $950k as the buyers’ ceiling', () => all('accept', ['s-ceiling'])],
      ['Try to edit it into the record instead', () => [{ type: 'edit', id: 's-ceiling', value: 'About $950k' }]],
      ['Try to record the car-loan statement as Rhys’s next action', () => all('accept', ['a-carloan'])],
      ['Accept the rest: the budget, rent and Rhys’s work are not touched', () => [{ type: 'acceptRest' }]],

<script>
/* ======================================================================
   Page shell (throwaway). Renders state and turns clicks into actions.
   ====================================================================== */
const CUES = IntakeReview.parseTranscript(document.getElementById('transcript-03').textContent);
const CHECK = IntakeReview.checkSuggestions(CUES, SUGGESTIONS);
const fresh = () => IntakeReview.initialState({ cues: CUES, suggestions: CHECK.kept, dropped: CHECK.dropped, ...SETUP });
const FIELDS = IntakeReview.FIELDS;
let state = fresh(), undo = [];
const ui = { focus: null, scroll: null, side: 'transcript', m: 'list', editing: null, walkOpen: false, walk: 0, step: -1 };

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nameOf = label => IntakeReview.nameOf(state, label);
const byId = id => state.ctx.suggestions.find(s => s.id === id);

function dispatch(action) {
  const next = IntakeReview.reduce(state, action);
  if (next.last.ok) undo.push(state);
  state = next;
  return next.last.ok;
}
function act(action) { dispatch(action); ui.editing = null; render(); }

/* ---- small pieces */
const pill = (text, tone) => `<span class="pill ${tone || ''}">${esc(text)}</span>`;
function quoteBtn(sid, kind, i, qq) {
  return `<button class="q" data-act="quote" data-sid="${sid}" data-kind="${kind}" data-i="${i}">“${esc(qq.text)}”<span class="by">${esc(nameOf(qq.speaker))} · ${qq.time}</span></button>`;
}
function quoteOf(s, kind, i) { return kind === 'e' ? s.conflict.earlier.quotes[i] : kind === 'v' ? s.conflict.views[i].quote : s.quotes[i]; }
function owes(s) { return s.owners ? `<div class="who-owes">${esc(s.owners.map(nameOf).join(' and '))} · due ${esc(s.due)}</div>` : ''; }

/* ---- rail, top, change line */
function renderRail() {
  const q = IntakeReview.queue(state), decided = q.filter(x => x.decision).length, matchedN = state.ctx.labels.filter(l => state.speakers[l] && state.speakers[l].name).length;
  const step = (n, stage, title, sub) => `<button class="${state.stage === stage ? 'on' : ''}" data-act="stage" data-stage="${stage}"><span class="n">${n}</span><span>${title}<small>${sub}</small></span></button>`;
  document.getElementById('rail').innerHTML = `
    <div class="logo"><span class="logo-symbol"></span>Buyers desk</div>
    <div><div class="rail-label">Buying engagement</div><div class="client">Tash Kumar &amp; Rhys Gallagher<small>Enquiry · web form · first consultation</small></div></div>
    <div><div class="rail-label">Consultation intake</div><nav class="steps">
      ${step(1, 'speakers', 'Match speakers', `${matchedN} of ${state.ctx.labels.length} matched`)}
      ${step(2, 'review', 'Review suggestions', state.stage === 'speakers' ? 'Hidden until speakers match' : `${decided} of ${q.length} decided`)}
      ${step(3, 'result', 'Applied result', 'Brief, gaps, next actions')}
    </nav></div>
    <div class="rail-foot">Synthetic transcript 03 · hand-written suggestions, no model. Records live in memory only.</div>`;
}
function renderTop() {
  const me = state.ctx.labels.find(l => state.speakers[l] && state.speakers[l].kind === 'agent');
  return `<div class="top"><div class="crumb"><b>First consultation</b> · 03-broker-joins-first-home-north.vtt · ${CUES.length} lines · reviewing as ${me ? esc(state.speakers[me].name) + ', who ran the call' : 'the agent who ran the call'}</div><span class="nomodel">Hand-written suggestions · no model</span></div>
  <details class="about"${state.seq === 0 ? ' open' : ''}><summary>What this prototype asks</summary>
    <p class="question">Can the person who ran a consultation check, correct and apply suggested intake details quickly, without an inferred, conflicting or wrong-speaker suggestion slipping into the record?</p>
    <ul>
      <li>Nothing here came from a model. Claude hand-wrote ${SUGGESTIONS.length} suggestions from James's approved answer key for synthetic transcript 03, including a few mistakes of the kinds a model could make. ${CHECK.dropped.length} are malformed on purpose; code drops them before review.</li>
      <li>The engagement already holds two values from a web enquiry form (budget and Rhys's work). They are invented prototype setup, so you can see a suggestion meet an existing value.</li>
      <li>Rules in play: speakers are matched before anything shows; each suggestion carries a verbatim quote, speaker and stated or inferred mark; conflicts, inferred items and flagged items come first; one accept covers the stated, unconflicted rest; nothing is written until you decide.</li>
      <li>Only this transcript loads. Your own uploads stay on the hybrid's manual brief path; nothing here means extraction works. Walkthroughs are in the dark bar at the bottom.</li>
    </ul></details>
  <div class="changed ${state.last.ok ? '' : 'refused'}"><b>${state.last.ok ? 'Last change' : 'Refused'}</b>${esc(state.last.text)}</div>`;
}

/* ---- step 1: speakers */
function speakerOptions(label) {
  const m = state.speakers[label];
  const v = !m ? '' : m.kind === 'agent' ? 'agent' : m.kind === 'other' ? 'other' : m.isNew ? 'new' : 'hh:' + m.name;
  const opt = (val, text) => `<option value="${esc(val)}"${v === val ? ' selected' : ''}>${esc(text)}</option>`;
  return `<select data-change="kind" data-li="${state.ctx.labels.indexOf(label)}">${opt('', 'Not matched yet')}${opt('agent', 'You — the agent on this call')}${SETUP.people.map(p => opt('hh:' + p, `${p} (household member on record)`)).join('')}${opt('new', 'A new household member…')}${opt('other', 'Someone else (a professional, a friend)…')}</select>`;
}
function renderSpeakers() {
  const labels = state.ctx.labels;
  const cards = labels.map((l, li) => {
    const lines = CUES.filter(c => c.speaker === l), m = state.speakers[l];
    const samples = lines.slice(0, 3).map(c => `<button class="q" data-act="cue" data-cue="${c.n}">“${esc(c.text)}”<span class="by">${c.time}</span></button>`).join('');
    const extra = !m ? '' : m.kind === 'other'
      ? `<div class="two-in"><label>Name</label><input data-change="name" data-li="${li}" value="${esc(m.name)}" placeholder="e.g. Dan"><label>Role</label><input data-change="role" data-li="${li}" value="${esc(m.role)}" placeholder="e.g. Mortgage broker"></div>`
      : m.kind === 'household' && m.isNew ? `<label>Name</label><input data-change="name" data-li="${li}" value="${esc(m.name)}" placeholder="Their name">` : '';
    return `<div class="card speaker"><div class="fieldname">Label in the transcript</div><div class="value">${esc(l)}</div>
      <small>${lines.length} lines · first speaks at ${lines[0].time}</small>${m && m.guessed ? ` · <span class="guess">Suggested from the name — check it</span>` : ''}
      ${samples}<label>Who is this?</label>${speakerOptions(l)}${extra}</div>`;
  }).join('');
  return `<h1>Who spoke on this call?</h1><p class="lede">Match each label before any suggestion appears. Every rule later relies on this: only household members can set buyer requirements, and a next action needs words from whoever owes it.</p>
    ${cards}<div class="foot"><small>${labels.filter(l => state.speakers[l] && state.speakers[l].name).length} of ${labels.length} matched</small><button class="primary" data-act="confirm">Speakers are right — show suggestions</button></div>`;
}

/* ---- step 2: review */
function decideCard(x) {
  const { s, reasons, blocked, current } = x, f = FIELDS[s.field], c = s.conflict;
  const sel = ui.focus && ui.focus.sid === s.id;
  const basis = s.basis === 'inferred' ? pill('Inferred', 'warn') : pill('Stated', 'plain');
  const pills = basis + reasons.filter(r => r.code !== 'inferred').map(r => pill(r.text, r.tone)).join('') + (f.key ? pill('Key item', 'plain') : '');
  let asides = '';
  if (c && c.type === 'superseded') asides += `<div class="aside"><b>Earlier in the call</b>${esc(c.earlier.value)}${c.earlier.quotes.map((qq, i) => quoteBtn(s.id, 'e', i, qq)).join('')}</div>`;
  if (c && c.type === 'disagreement') asides += `<div class="aside"><b>They see it differently</b>${c.views.map((v, i) => `<div><strong>${esc(nameOf(v.who))}:</strong> ${esc(v.view)}${quoteBtn(s.id, 'v', i, v.quote)}</div>`).join('')}</div>`;
  if (current && current.sid !== s.id) asides += `<div class="aside"><b>On record now</b>${esc(current.value)} <small>· ${esc(current.source)}</small></div>`;
  if (blocked) asides += `<div class="aside bad"><b>Can't be applied as it stands</b>${esc(blocked)}</div>`;
  let acts;
  if (ui.editing === s.id) acts = `<label>Edit the value (the quotes stay as its source)</label><textarea id="edit-${s.id}">${esc(s.value)}</textarea><div class="acts"><button class="primary" data-act="save" data-id="${s.id}">Save and apply</button><button class="quiet" data-act="cancel">Cancel</button></div>`;
  else if (blocked) acts = `<div class="acts"><button data-act="ask" data-id="${s.id}">Ask the client</button><button class="danger" data-act="reject" data-id="${s.id}">Reject</button></div>`;
  else if (c && c.type === 'superseded') acts = `<div class="acts"><button class="primary" data-act="accept" data-id="${s.id}">Use the later value</button><button data-act="earlier" data-id="${s.id}">Use the earlier value</button><button data-act="edit" data-id="${s.id}">Edit</button><button data-act="ask" data-id="${s.id}">Ask the client</button><button class="danger" data-act="reject" data-id="${s.id}">Reject</button></div>`;
  else if (c && c.type === 'disagreement') acts = `<div class="acts"><button class="primary" data-act="accept" data-id="${s.id}">Keep as “to discuss”</button><button data-act="edit" data-id="${s.id}">Edit (they agreed)</button><button class="danger" data-act="reject" data-id="${s.id}">Reject</button></div>`;
  else acts = `<div class="acts"><button class="primary" data-act="accept" data-id="${s.id}">${current ? 'Replace with this' : 'Accept'}</button><button data-act="edit" data-id="${s.id}">Edit</button><button data-act="ask" data-id="${s.id}">Ask the client</button><button class="danger" data-act="reject" data-id="${s.id}">Reject</button></div>`;
  return `<div class="card${sel ? ' sel' : ''}${blocked ? ' blocked' : ''}" data-focus="${s.id}">
    <div class="fieldname">${esc(f.item)}</div><div class="value">${esc(s.value)}</div>${owes(s)}<div class="pills">${pills}</div>
    ${s.detail ? `<div class="note">${esc(s.detail)}</div>` : ''}${s.quotes.map((qq, i) => quoteBtn(s.id, 'q', i, qq)).join('')}
    ${s.note ? `<div class="note">${esc(s.note)}</div>` : ''}${asides}${acts}</div>`;
}
function readyRow(x) {
  const s = x.s, f = FIELDS[s.field], sel = ui.focus && ui.focus.sid === s.id;
  if (ui.editing === s.id) return `<div class="row sel" data-focus="${s.id}"><div><div class="fieldname">${esc(f.item)}</div><textarea id="edit-${s.id}">${esc(s.value)}</textarea>${s.quotes.map((qq, i) => quoteBtn(s.id, 'q', i, qq)).join('')}</div><div class="acts"><button class="primary" data-act="save" data-id="${s.id}">Save and apply</button><button class="quiet" data-act="cancel">Cancel</button></div></div>`;
  return `<div class="row${sel ? ' sel' : ''}" data-focus="${s.id}"><div><div class="fieldname">${esc(f.item)}${f.key ? ' · key item' : ''}</div><div class="value">${esc(s.value)}</div>${owes(s)}${s.detail ? `<div class="note">${esc(s.detail)}</div>` : ''}${s.quotes.map((qq, i) => quoteBtn(s.id, 'q', i, qq)).join('')}</div>
    <div class="acts"><button data-act="edit" data-id="${s.id}">Edit</button><button class="danger" data-act="reject" data-id="${s.id}">Reject</button></div></div>`;
}
function grouped(items, fn) {
  return IntakeReview.SECTIONS.map(([k, title]) => {
    const g = items.filter(x => FIELDS[x.s.field].section === k);
    return g.length ? `<div class="group">${title} · ${g.length}</div>${g.map(fn).join('')}` : '';
  }).join('');
}
const STATUS = { accepted: ['Applied', ''], edited: ['Edited', ''], earlier: ['Earlier value', 'warn'], discuss: ['To discuss', 'warn'], rejected: ['Rejected', 'bad'], ask: ['Ask the client', 'plain'] };
function renderReview() {
  const q = IntakeReview.queue(state);
  const decide = q.filter(x => x.bucket === 'decide'), ready = q.filter(x => x.bucket === 'ready'), doneList = q.filter(x => x.bucket === 'done').sort((a, b) => b.decision.seq - a.decision.seq);
  return `<h1>Review what the call suggests</h1><p class="lede">${q.length} suggestions passed the quote check; ${CHECK.dropped.length} were dropped by code before you saw them. Click any quote to find it in the transcript.</p>
    <div class="section-title"><h2>1 · Needs your decision (${decide.length})</h2></div>
    <p class="section-note">Inferred, changed during the call, disagreed, replacing a value on record, or not said by the right person.</p>
    ${decide.length ? grouped(decide, decideCard) : '<div class="empty">Nothing left here.</div>'}
    <div class="section-title"><h2>2 · Ready to accept (${ready.length})</h2></div>
    <p class="section-note">Stated by a household member (or, for finance facts and their own actions, a professional), with no conflict.</p>
    <div class="ready">${ready.length ? `<div class="bulk"><p>One click applies every row below. Rows you edit or reject first are left out.</p><button class="primary" data-act="rest">Accept all ${ready.length}</button></div>${grouped(ready, readyRow)}` : '<div class="empty">Nothing waiting.</div>'}</div>
    <details class="decided"><summary>Decided so far (${doneList.length})</summary>${doneList.map(x => `<div class="drow" data-focus="${x.s.id}">${pill(...STATUS[x.decision.status])}<span><span class="muted">${esc(FIELDS[x.s.field].item)}:</span> ${esc(x.decision.value || x.s.value)}</span></div>`).join('') || '<div class="empty">Nothing yet.</div>'}<p class="note">Use Undo in the bottom bar to take a decision back.</p></details>
    <div class="foot"><button class="quiet" data-act="stage" data-stage="speakers">← Speakers</button><button class="primary" data-act="finish">Finish review</button></div>`;
}

/* ---- side panel: transcript or record so far */
function renderTranscript() {
  const s = ui.focus && ui.focus.sid && byId(ui.focus.sid);
  const marks = {};
  if (s) [s.quotes, (s.conflict && s.conflict.earlier && s.conflict.earlier.quotes) || [], ((s.conflict && s.conflict.views) || []).map(v => v.quote)].flat().forEach(qq => { (marks[qq.cue] = marks[qq.cue] || []).push(qq.text); });
  return CUES.map(c => {
    let text = esc(c.text);
    (marks[c.n] || []).forEach(t => { text = text.split(esc(t)).join(`<mark>${esc(t)}</mark>`); });
    const m = state.speakers[c.speaker], shown = m && m.name ? nameOf(c.speaker) : c.speaker;
    return `<div class="cue${marks[c.n] ? ' hit' : ''}${ui.focus && ui.focus.cue === c.n ? ' focus' : ''}" id="cue-${c.n}"><span class="t">${c.time}</span><div><div class="who">${esc(shown)}${shown !== c.speaker ? ` <small>${esc(c.speaker)}</small>` : ''}</div>${text}</div></div>`;
  }).join('');
}
function entryLine(e, f) {
  const hist = (e.history || []).map(h => `<div class="was">Replaced: ${esc(h.value)} · ${esc(h.source)}</div>`).join('');
  const lead = f.section === 'actions' ? `${esc((e.owners || []).map(nameOf).join(' and '))}: ` : '';
  return `<div class="kv"><div class="k">${esc(f.item)}${e.status === 'edited' ? ' · edited' : e.status === 'earlier' ? ' · earlier value' : ''}</div>${lead}${esc(e.value)}${e.due ? ` <span class="muted">· ${esc(e.due)}</span>` : ''}${e.detail ? `<div class="src">${esc(e.detail)}</div>` : ''}<div class="src">${esc(e.source)}</div>${hist}</div>`;
}
function renderRecord() {
  const sum = IntakeReview.summary(state);
  const sec = ([k, title]) => `<h3>${title}</h3>${k === 'profile' ? `<div class="kv"><div class="k">People</div>${esc(sum.people.join(', '))}</div>` : ''}${sum.entries[k].map(x => entryLine(x.e, x.f)).join('') || (k === 'profile' ? '' : '<div class="empty">Nothing yet.</div>')}`;
  return `<div class="rec">${IntakeReview.SECTIONS.map(sec).join('')}<h3>To discuss</h3>${sum.toDiscuss.map(x => entryLine(x.e, x.f)).join('') || '<div class="empty">Nothing yet.</div>'}<h3>Ask the client</h3>${sum.ask.map(s => `<div class="kv">${esc(FIELDS[s.field].item)}: ${esc(s.value)}</div>`).join('') || '<div class="empty">Nothing yet.</div>'}</div>`;
}
function renderSide() {
  const tab = ui.m === 'record' ? 'record' : ui.m === 'transcript' ? 'transcript' : ui.side;
  return `<aside class="side"><div class="side-tabs"><button class="${tab === 'transcript' ? 'on' : ''}" data-act="side" data-side="transcript">Transcript</button><button class="${tab === 'record' ? 'on' : ''}" data-act="side" data-side="record">Record so far</button></div>
    <div class="side-body" id="side-body">${tab === 'record' ? renderRecord() : renderTranscript()}</div></aside>`;
}

/* ---- step 3: result */
function renderResult() {
  const sum = IntakeReview.summary(state), cmp = compareWithKey(state);
  const groups = sec => {
    const items = sum.entries[sec]; const names = [...new Set(items.map(x => x.f.group))];
    return names.map(g => `<div class="group">${esc(g)}</div>${items.filter(x => x.f.group === g).map(x => entryLine(x.e, x.f)).join('')}`).join('') || '<div class="empty">Nothing applied.</div>';
  };
  const actions = sum.entries.actions;
  const verdict = { ok: ['As the key expects', 'verdict-ok'], slipped: ['Slipped into the record', 'verdict-bad'], wrong: ['Wrong value applied', 'verdict-bad'], missed: ['Left out (recoverable)', 'verdict-warn'], unreviewed: ['Not reviewed', 'verdict-warn'], check: ['Resolved; key keeps it to discuss', 'verdict-warn'] };
  const notable = cmp.rows.filter(r => r.v !== 'ok' || r.k.trap);
  return `<h1>Applied to Tash and Rhys's engagement</h1><p class="lede">This is everything the review wrote. Rejected, unreviewed and ask-the-client items wrote nothing.</p>
    <div class="stats"><div class="stat"><b>${sum.written}</b><span>written</span></div><div class="stat"><b>${sum.toDiscuss.length}</b><span>to discuss</span></div><div class="stat"><b>${sum.ask.length}</b><span>ask the client</span></div><div class="stat"><b>${sum.rejected.length}</b><span>rejected</span></div><div class="stat"><b>${sum.undecided.length}</b><span>left undecided</span></div><div class="stat ${cmp.slipped.length ? 'bad' : ''}"><b>${cmp.slipped.length}</b><span>slipped in (vs key)</span></div></div>
    ${cmp.slipped.length ? `<div class="aside bad" style="margin:0 0 20px"><b>Slipped into the record, compared with James's approved key</b>${cmp.slipped.map(r => `<div>${esc(r.f.item)}: ${esc(r.d === 'edited' ? r.rowValue : r.s.value)}${r.k.trap ? ` — ${esc(r.k.trap)}. ${esc(r.k.why)}` : r.v === 'wrong' ? ' — the key expects the later value' : ''}</div>`).join('')}<div class="note">Full comparison under Checks below.</div></div>` : `<div class="aside" style="margin:0 0 20px"><b>Compared with James's approved key</b>Nothing slipped into the record. Full comparison under Checks below.</div>`}
    <div class="result"><div>
      <div class="panel"><h2>Buyer brief</h2>${groups('brief')}</div>
      <div class="panel"><h2>Engagement intake</h2>${groups('intake')}</div>
      <div class="panel"><h2>Properties mentioned</h2>${sum.entries.properties.map(x => entryLine(x.e, x.f)).join('') || '<div class="empty">None applied.</div>'}</div>
      <div class="panel"><h2>Buyer profile</h2><div class="kv"><div class="k">People</div>${esc(sum.people.join(', '))}</div>${groups('profile')}</div>
    </div><div>
      <div class="panel"><h2>Next actions</h2>${actions.length ? `<table><tr><th>Who owes it</th><th>What</th><th>Due</th></tr>${actions.map(({ e }) => `<tr><td>${esc((e.owners || []).map(nameOf).join(' and '))}</td><td>${esc(e.value)}</td><td>${esc(e.due)}</td></tr>`).join('')}</table>` : '<div class="empty">None applied.</div>'}</div>
      <div class="panel"><h2>To discuss with them</h2>${sum.toDiscuss.map(x => `<div class="kv"><div class="k">${esc(x.f.item)}</div>${esc(x.e.value)}${(byId(x.e.sid).conflict.views || []).map(v => `<div class="src">${esc(nameOf(v.who))}: ${esc(v.view)}</div>`).join('')}</div>`).join('') || '<div class="empty">Nothing.</div>'}</div>
      <div class="panel"><h2>Ask the client</h2>${sum.ask.map(s => `<div class="kv"><div class="k">${esc(FIELDS[s.field].item)}</div>${esc(s.value)}</div>`).join('') || '<div class="empty">Nothing.</div>'}</div>
      <div class="panel"><h2>What the call did not cover</h2><ul class="gaps">${sum.notCovered.map(g => `<li>${esc(g)}</li>`).join('')}</ul></div>
    </div></div>
    <div class="panel"><h2>Checks</h2>
      <div class="group">Dropped by code before review (${sum.dropped.length})</div>${sum.dropped.map(d => `<div class="kv"><div class="k">${esc(d.fieldLabel || (FIELDS[d.field] ? FIELDS[d.field].item : d.field))}: ${esc(d.value)}</div>${esc(d.reason)}</div>`).join('')}
      <div class="group">Against James's approved key (prototype check, not the extraction pass bar)</div>
      <p class="note">Key items as the key expects: ${cmp.keyOk} of ${cmp.keyTotal} (budget target, pre-approval, every deal-breaker and next action). Other fields: ${cmp.otherOk} of ${cmp.otherTotal}. Deliberate mistakes kept out or fixed: ${cmp.trapsKept} of ${cmp.traps}.</p>
      <table><tr><th>Suggestion</th><th>Your decision</th><th>Verdict</th><th>Why it matters</th></tr>${notable.map(r => `<tr><td><span class="muted">${esc(r.f.item)}:</span> ${esc(r.s.value)}</td><td>${r.d ? STATUS[r.d][0] : '—'}</td><td class="${verdict[r.v][1]}">${verdict[r.v][0]}</td><td>${esc(r.k.trap ? `${r.k.trap}. ${r.k.why}` : '')}</td></tr>`).join('')}</table>
    </div>
    <div class="foot"><button class="quiet" data-act="back">← Back to review</button><small>Records live in memory only. Start over from the bottom bar.</small></div>`;
}

/* ---- walkthroughs and bar */
function renderWalk() {
  const w = WALKS[ui.walk];
  const el = document.getElementById('walk'); el.hidden = !ui.walkOpen;
  el.innerHTML = `<div class="wtabs">${WALKS.map((x, i) => `<button class="${i === ui.walk ? 'on' : ''}" data-act="wtab" data-i="${i}">${i + 1}. ${esc(x.name)}</button>`).join('')}</div>
    <p>${esc(w.about)}</p><button class="primary" data-act="wstart">${ui.step === -1 ? 'Start' : 'Restart'} this walkthrough</button> <small>Starting resets to the same first state every time.</small>
    <ol class="wsteps">${w.steps.map(([t], k) => `<li><button class="${ui.step === k ? 'next' : ''}" data-act="wstep" data-k="${k}" ${ui.step === k ? '' : 'disabled'}><span class="n ${k < ui.step ? 'done' : ''}">${k < ui.step ? '✓' : k + 1}</span>${esc(t)}</button></li>`).join('')}</ol>`;
  document.getElementById('bar').innerHTML = `<span class="tag">PROTOTYPE · NO MODEL</span><span class="sep"></span><button class="${ui.walkOpen ? 'on' : ''}" data-act="walk">Walkthroughs ${ui.walkOpen ? '▾' : '▴'}</button><button data-act="undo" ${undo.length ? '' : 'disabled'}>Undo</button><button data-act="reset">Start over</button>`;
}

function render() {
  renderRail();
  const side = document.getElementById('side-body'), keep = side ? side.scrollTop : 0, sideTab = ui.side;
  const mtabs = `<div class="mtabs"><button class="${ui.m === 'list' ? 'on' : ''}" data-act="m" data-m="list">${state.stage === 'speakers' ? 'Speakers' : 'Suggestions'}</button><button class="${ui.m === 'transcript' ? 'on' : ''}" data-act="m" data-m="transcript">Transcript</button><button class="${ui.m === 'record' ? 'on' : ''}" data-act="m" data-m="record">Record</button></div>`;
  let body;
  if (state.stage === 'result') body = renderResult();
  else body = `${mtabs}<div class="work" data-m="${ui.m}"><div class="list">${state.stage === 'speakers' ? renderSpeakers() : renderReview()}</div>${renderSide()}</div>`;
  document.getElementById('main').innerHTML = renderTop() + body;
  renderWalk();
  const nside = document.getElementById('side-body');
  if (nside) {
    const target = ui.scroll != null && document.getElementById('cue-' + ui.scroll);
    if (target) nside.scrollTop = target.offsetTop - nside.clientHeight / 2 + target.clientHeight / 2;
    else if (sideTab === ui.side) nside.scrollTop = keep;
  }
  ui.scroll = null;
}

/* ---- events */
function focusSuggestion(sid, qq) {
  const s = byId(sid); const first = qq || s.quotes[0];
  ui.focus = { sid, cue: first.cue }; ui.scroll = first.cue; ui.side = 'transcript';
  if (qq && window.matchMedia('(max-width:900px)').matches) ui.m = 'transcript';
}
function runStep(k) {
  const fn = WALKS[ui.walk].steps[k][1], actions = fn(state);
  let refused = null, okCount = 0, lastText = state.last.text;
  for (const a of actions) { if (dispatch(a)) okCount++; else refused = refused || state.last.text; lastText = state.last.text; }
  if (actions.length > 1) state = { ...state, last: refused && !okCount ? { ok: false, text: refused } : { ok: true, text: `${okCount} action${okCount === 1 ? '' : 's'} done.${refused ? ` ${actions.length - okCount} refused, e.g. ${refused}` : ''} Last: ${lastText}` } };
  else if (!actions.length) state = { ...state, last: { ok: true, text: 'Nothing to press for this step: look at the page.' } };
  ui.step = k + 1 < WALKS[ui.walk].steps.length ? k + 1 : -2;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) { const card = e.target.closest('[data-focus]'); if (card && !e.target.closest('textarea,input,select')) { focusSuggestion(card.dataset.focus); render(); } return; }
  const d = b.dataset;
  switch (d.act) {
    case 'quote': { const s = byId(d.sid); focusSuggestion(d.sid, quoteOf(s, d.kind, +d.i)); break; }
    case 'cue': ui.focus = { cue: +d.cue }; ui.scroll = +d.cue; ui.side = 'transcript'; if (window.matchMedia('(max-width:900px)').matches) ui.m = 'transcript'; break;
    case 'accept': return act({ type: 'accept', id: d.id });
    case 'earlier': return act({ type: 'useEarlier', id: d.id });
    case 'reject': return act({ type: 'reject', id: d.id });
    case 'ask': return act({ type: 'ask', id: d.id });
    case 'edit': ui.editing = d.id; focusSuggestion(d.id); render(); { const t = document.getElementById('edit-' + d.id); if (t) t.focus(); } return;
    case 'save': return act({ type: 'edit', id: d.id, value: document.getElementById('edit-' + d.id).value });
    case 'cancel': ui.editing = null; break;
    case 'rest': return act({ type: 'acceptRest' });
    case 'confirm': ui.m = 'list'; return act({ type: 'confirmSpeakers' });
    case 'finish': window.scrollTo(0, 0); return act({ type: 'finish' });
    case 'back': return act({ type: 'back' });
    case 'stage': {
      const to = d.stage, from = state.stage;
      if (to === from) return;
      if (to === 'speakers') return act({ type: 'editSpeakers' });
      if (to === 'review') return act(from === 'speakers' ? { type: 'confirmSpeakers' } : { type: 'back' });
      if (to === 'result') return act(from === 'review' ? { type: 'finish' } : { type: 'confirmSpeakers' });
      return;
    }
    case 'side': ui.side = d.side; break;
    case 'm': ui.m = d.m; break;
    case 'undo': if (undo.length) { state = { ...undo.pop() }; state = { ...state, last: { ok: true, text: 'Undid the last change.' } }; ui.step = -1; } break;
    case 'reset': state = fresh(); undo = []; ui.focus = null; ui.editing = null; ui.step = -1; ui.m = 'list'; break;
    case 'walk': ui.walkOpen = !ui.walkOpen; break;
    case 'wtab': ui.walk = +d.i; ui.step = -1; break;
    case 'wstart': state = fresh(); undo = []; ui.focus = null; ui.editing = null; ui.m = 'list'; ui.step = 0; state = { ...state, last: { ok: true, text: `Walkthrough “${WALKS[ui.walk].name}” started from a fresh state.` } }; break;
    case 'wstep': runStep(+d.k); window.scrollTo(0, 0); break;
  }
  render();
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset; if (!d.change) return;
  const label = state.ctx.labels[+d.li], m = state.speakers[label] || {};
  if (d.change === 'kind') {
    const v = t.value;
    if (!v) act({ type: 'matchSpeaker', label, kind: null });
    else if (v === 'agent') act({ type: 'matchSpeaker', label, kind: 'agent', name: 'Nadia Pearce' });
    else if (v === 'new') act({ type: 'matchSpeaker', label, kind: 'household', name: '', isNew: true });
    else if (v === 'other') act({ type: 'matchSpeaker', label, kind: 'other', name: '', role: '' });
    else act({ type: 'matchSpeaker', label, kind: 'household', name: v.slice(3) });
  } else act({ type: 'matchSpeaker', label, kind: m.kind, name: d.change === 'name' ? t.value : m.name, role: d.change === 'role' ? t.value : m.role, isNew: m.isNew });
});
render();
</script>
