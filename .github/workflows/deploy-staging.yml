name: Deploy to Staging

on:
  push:
    branches: [staging]

jobs:
  deploy-staging:
    name: Deploy API to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Apply staging DB migrations
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run db:migrate

      - name: Trigger Render staging deploy
        env:
          RENDER_STAGING_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: |
          curl -sf -X POST "$RENDER_STAGING_DEPLOY_HOOK"
          echo "Render staging deploy triggered"

      - name: Wait for deploy to go live
        run: |
          echo "Waiting 3 minutes for Render deploy..."
          sleep 180

      - name: Smoke test staging
        run: |
          echo "Running health check..."
          curl -sf https://realflow-api-staging.onrender.com/health || (echo "Health check failed" && exit 1)
          echo "Staging health check passed"
