name: Mobile Build

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "packages/business-logic/**"

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  eas-build:
    name: EAS Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    strategy:
      matrix:
        platform: [ios, android]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npx turbo build --filter=@realflow/shared --filter=@realflow/business-logic

      - name: Run EAS Build
        working-directory: apps/mobile
        run: eas build --platform ${{ matrix.platform }} --profile production --non-interactive

  ota-update:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [eas-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npx turbo build --filter=@realflow/shared --filter=@realflow/business-logic

      - name: Publish OTA update
        working-directory: apps/mobile
        run: eas update --branch production --message "OTA update from commit ${{ github.sha }}"
