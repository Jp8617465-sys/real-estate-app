name: Factory check
on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'claude/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The full `make check` needs PostgreSQL, uv and Node; provisioning them in CI needs a reviewed, pinned change.
      - run: make check-factory
