name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy-production:
    name: Deploy API to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Apply production DB migrations
        env:
          SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run db:migrate

      - name: Trigger Render production deploy
        env:
          RENDER_PRODUCTION_DEPLOY_HOOK: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}
        run: |
          curl -sf -X POST "$RENDER_PRODUCTION_DEPLOY_HOOK"
          echo "Render production deploy triggered"

      - name: Wait for deploy to go live
        run: |
          echo "Waiting 5 minutes for Render production deploy..."
          sleep 300

      - name: Smoke test production
        run: |
          echo "Running production health check..."
          curl -sf https://realflow-api.onrender.com/health || (echo "Production health check failed" && exit 1)
          echo "Production health check passed"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: deploy-${{ github.run_number }}
          release_name: Production Deploy ${{ github.run_number }}
          body: |
            Automated production deploy from commit ${{ github.sha }}

            Deployed by: ${{ github.actor }}
            Workflow: ${{ github.run_id }}
          draft: false
          prerelease: false
